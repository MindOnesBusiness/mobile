<style>
:root{
  --bg:#0a0907; --bg2:#13110d; --card:#17140f; --card2:#211c14;
  --ink:#f2ead9; --muted:#a3967f; --foil:#c9a160; --foil2:#e8c98c;
  --accent:#7a5a2a; --vip:#ffd27a; --danger:#ff5a5a;
  --radius:18px; --nav:68px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Cormorant Garamond',Georgia,serif; font-size:19px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  background-image:radial-gradient(ellipse at top, color-mix(in srgb,var(--accent) 22%, transparent), transparent 60%),
                   radial-gradient(ellipse at bottom, color-mix(in srgb,var(--foil) 10%, transparent), transparent 55%);
  background-attachment:fixed;
}
h1,h2,h3,.cinzel{font-family:'Cinzel',serif;letter-spacing:.06em}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--foil2)}
.app{max-width:560px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(var(--nav) + env(safe-area-inset-bottom) + 24px)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand img{width:42px;height:42px;display:block}
.logo,.brand img{mix-blend-mode:screen;-webkit-mask-image:radial-gradient(circle closest-side,#000 80%,transparent 87%);mask-image:radial-gradient(circle closest-side,#000 80%,transparent 87%)}
.logo{display:block;width:100%;height:auto}
blockonomics-pay-button:not(:defined)::before{content:"Loading checkout…";font-style:italic;color:var(--muted)}
.brand b{font-family:'Cinzel';font-weight:900;font-size:20px;letter-spacing:.14em}
.brand small{display:block;font-size:11px;letter-spacing:.3em;color:var(--muted);font-family:'Cinzel'}
.badge{font-family:'Cinzel';font-size:11px;letter-spacing:.18em;padding:6px 10px;border-radius:999px;border:1px solid var(--muted);color:var(--muted);white-space:nowrap}
.badge.vip{border-color:var(--vip);color:var(--vip);box-shadow:0 0 14px color-mix(in srgb,var(--vip) 45%,transparent)}
.preview-bar{font-family:'Cinzel';font-size:11px;letter-spacing:.12em;text-align:center;padding:8px;border:1px dashed var(--foil);border-radius:12px;color:var(--foil2);margin-bottom:16px}

/* shelf */
.section-title{font-family:'Cinzel';font-size:13px;letter-spacing:.3em;color:var(--muted);margin:6px 0 14px;text-transform:uppercase}
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.vol{position:relative;aspect-ratio:2/3.3;border-radius:var(--radius);cursor:pointer;border:0;background:none;text-align:center;transition:transform .25s}
.vol:active{transform:scale(.97)}
.vol.soon{cursor:default;opacity:.7}
.vol-inner{position:absolute;inset:0;border-radius:var(--radius);background:linear-gradient(160deg,var(--card2),var(--card));
  border:1.5px solid var(--foil);box-shadow:inset 0 0 0 6px var(--card),inset 0 0 0 7px color-mix(in srgb,var(--foil) 60%,transparent),0 12px 30px rgba(0,0,0,.5);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:18px 12px}
.vol .num{font-family:'Cinzel';color:var(--foil);font-size:15px;letter-spacing:.2em}
.vol .coin{width:76%}

.vol h3{font-size:15px;line-height:1.25;color:var(--ink)}
.vol p{font-size:14px;color:var(--muted);font-style:italic}
.vol .tag{font-family:'Cinzel';font-size:10px;letter-spacing:.2em;color:var(--vip)}

/* tarot page */
.reader-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.back{background:none;border:0;color:var(--muted);font-family:'Cinzel';font-size:13px;letter-spacing:.12em;cursor:pointer;padding:6px 0}
.counter{font-family:'Cinzel';font-size:12px;letter-spacing:.2em;color:var(--muted)}
.tarot{position:relative;border-radius:22px;background:linear-gradient(170deg,var(--card2),var(--card) 60%);
  border:1.5px solid var(--foil);padding:12px;min-height:62vh;box-shadow:0 20px 50px rgba(0,0,0,.55);animation:flip .45s ease}
.skip{position:absolute;left:-9999px;top:8px;z-index:50;background:var(--foil);color:#140e05;padding:10px 14px;border-radius:10px;font-family:'Cinzel';font-size:13px}
.skip:focus{left:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--vip);outline-offset:3px;border-radius:6px}
main:focus{outline:none}
html.big .app{zoom:1.18}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.foot{text-align:center;margin:28px 0 6px;font-size:15px;color:var(--muted);line-height:1.8}
.foot a{color:var(--muted);text-decoration:underline;text-underline-offset:3px;margin:0 6px;white-space:nowrap}
.foot .fine{font-size:13px;margin-top:8px;font-style:italic}
.start{border-color:var(--foil);text-align:center}
.optin{display:flex;gap:10px;align-items:flex-start;font-family:'Cormorant Garamond';font-size:17px;letter-spacing:0;color:var(--ink);margin:14px 0 0;cursor:pointer}
.optin input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--foil)}
.start h2{font-size:20px;color:var(--foil2)}
.start ul{list-style:none;margin:6px 0 14px;padding:0;text-align:left;display:inline-block}
.start li{margin:6px 0;padding-left:26px;position:relative}
.start li::before{content:"✦";position:absolute;left:4px;color:var(--foil)}
.btn.big{font-size:15px;padding:16px 26px;min-height:54px}
.newcrypto{display:inline-block;margin-top:10px;font-size:16px}
.guide h2{font-size:18px;margin-bottom:8px}
.guide ol,.guide ul{margin:0 0 6px 22px}.guide li{margin-bottom:8px}
.legal h2{font-size:16px;margin:16px 0 6px}.legal p,.legal li{color:var(--ink);font-size:17px}.legal ul{margin:0 0 10px 22px}
@keyframes flip{from{transform:perspective(900px) rotateY(-14deg) translateX(14px);opacity:0}to{transform:none;opacity:1}}
.tarot-frame{border:1px solid color-mix(in srgb,var(--foil) 55%,transparent);border-radius:14px;min-height:calc(62vh - 24px);padding:22px 20px 26px;position:relative;display:flex;flex-direction:column}
.corner{position:absolute;width:22px;height:22px;color:var(--foil)}
.corner.tl{top:6px;left:6px}.corner.tr{top:6px;right:6px;transform:scaleX(-1)}.corner.bl{bottom:6px;left:6px;transform:scaleY(-1)}.corner.br{bottom:6px;right:6px;transform:scale(-1)}
.numeral{font-family:'Cinzel';font-weight:700;text-align:center;color:var(--foil);font-size:22px;letter-spacing:.25em}
.page-title{text-align:center;font-size:24px;margin:6px 0 4px;line-height:1.2}
.rule{display:flex;align-items:center;gap:10px;color:var(--foil);margin:10px 0 16px}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--foil),transparent)}
.body p{margin:0 0 12px}
.body ul,.body ol{margin:0 0 12px 22px}
.body li{margin-bottom:6px}
.body blockquote{border-left:2px solid var(--foil);padding:4px 0 4px 14px;font-style:italic;color:var(--foil2);margin:0 0 14px}
.body strong{color:var(--foil2)}
.body .declare{border:1px dashed var(--vip);border-radius:12px;padding:14px;font-style:italic}
.locked{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.locked .coin{width:60%;max-width:220px;border-radius:50%;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 18px color-mix(in srgb,var(--vip) 25%,transparent)}50%{box-shadow:0 0 42px color-mix(in srgb,var(--vip) 55%,transparent)}}
.paybtn{display:block;margin-top:6px}
.paybtn blockonomics-pay-button{display:inline-block}
.locked p{color:var(--muted);font-style:italic}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:12px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:1}
.dot{width:7px;height:7px;border-radius:50%;background:color-mix(in srgb,var(--muted) 45%,transparent)}
.dot.on{background:var(--foil)}.dot.v{box-shadow:0 0 0 1px var(--vip)}.dot.m{box-shadow:0 0 0 1px var(--foil2)}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;border:1px solid var(--foil);background:transparent;color:var(--foil2);
  font-family:'Cinzel';font-size:13px;letter-spacing:.14em;cursor:pointer;text-decoration:none;min-height:44px}
.btn.solid{background:var(--foil);color:#140e05;font-weight:700}
.btn.vip{border-color:var(--vip);color:var(--vip);box-shadow:0 0 16px color-mix(in srgb,var(--vip) 35%,transparent)}
.btn.vip.solid{background:var(--vip);color:#1a1205}
.btn:disabled{opacity:.4;cursor:default}
.btn.round{width:46px;padding:0}
.panel{background:color-mix(in srgb,var(--card) 85%,transparent);border:1px solid color-mix(in srgb,var(--foil) 30%,transparent);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.panel h2{font-size:17px;margin-bottom:10px}
.panel p{color:var(--muted);margin-bottom:12px}
label{display:block;font-family:'Cinzel';font-size:11px;letter-spacing:.2em;color:var(--muted);margin:10px 0 6px}
input,textarea,select{width:100%;background:var(--bg2);border:1px solid color-mix(in srgb,var(--muted) 40%,transparent);border-radius:10px;padding:11px 12px;font-size:17px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--foil)}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.tabs{display:flex;gap:8px;margin-bottom:6px}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:8px;font-family:'Cinzel';font-size:12px;letter-spacing:.16em;color:var(--muted);cursor:pointer}
.tabs button.on{color:var(--foil2);border-color:var(--foil)}

/* forum */
.cat-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chip{flex:none;border:1px solid color-mix(in srgb,var(--muted) 45%,transparent);border-radius:999px;padding:6px 12px;font-size:14px;background:none;cursor:pointer;color:var(--muted)}
.chip.on{border-color:var(--vip);color:var(--vip)}
.thread{display:block;width:100%;text-align:left;background:var(--card);border:1px solid color-mix(in srgb,var(--foil) 22%,transparent);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}
.thread.sealed{opacity:.6;border-style:dashed}
.thread h3{font-family:'Cormorant Garamond';font-weight:600;font-size:19px;letter-spacing:0}
.meta{font-size:13px;color:var(--muted);font-family:'Cinzel';letter-spacing:.08em;margin-top:4px}
.post{border-left:2px solid color-mix(in srgb,var(--foil) 50%,transparent);padding:4px 0 4px 14px;margin:14px 0}
.post .who{font-family:'Cinzel';font-size:13px;letter-spacing:.1em;color:var(--foil2)}
.post .txt{white-space:pre-wrap}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);
  border-top:1px solid color-mix(in srgb,var(--foil) 30%,transparent);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(var(--navn,4),1fr);height:var(--nav)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-family:'Cinzel';font-size:10px;letter-spacing:.14em}
.nav a svg{width:22px;height:22px}
.nav a.on{color:var(--foil)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card2);border:1px solid var(--foil);padding:10px 16px;border-radius:12px;z-index:30;font-size:16px;max-width:90vw;text-align:center}
.empty{text-align:center;color:var(--muted);font-style:italic;padding:24px 0}
.hero{text-align:center;margin:4px 0 22px}
.hero h1{font-size:26px;line-height:1.2}
.hero p{color:var(--muted);font-style:italic;margin-top:6px}
.hidden{display:none!important}
.media.pdf{width:100%;height:64vh;border:1px solid color-mix(in srgb,var(--foil) 40%,transparent);border-radius:12px;background:#fff}
.vidwrap{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;border:1px solid color-mix(in srgb,var(--foil) 40%,transparent)}
.vidwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
video.media{width:100%;border-radius:12px;background:#000}
audio.media{width:100%;margin:6px 0 4px}
.item-desc{color:var(--muted);font-style:italic;text-align:center;margin-bottom:14px}
.vol .tag.free{color:var(--foil2)}
.adm-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid color-mix(in srgb,var(--muted) 25%,transparent)}
.adm-item:first-of-type{border-top:0}
.adm-item b{font-family:'Cormorant Garamond';font-size:18px;display:block}
.adm-item .btns{display:flex;gap:6px;flex:none}
.adm-item .btn{min-height:36px;padding:6px 10px;font-size:11px}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.gate-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.panel .gate-emotion{font-size:30px;color:var(--foil2);margin:6px 0 4px;letter-spacing:.08em}
.gate-signal{font-size:17px;margin-bottom:8px}
.gate-locked{opacity:.55}
.gate-locked .gate-emotion{color:var(--muted)}
.gate-sealed{font-family:'Cinzel';font-size:12px;letter-spacing:.18em;color:var(--vip);margin:2px 0 0}
.gate-q.blur{filter:blur(5px);user-select:none}
.gate-q{font-family:'Cormorant Garamond';font-weight:600;font-style:italic;font-size:20px;letter-spacing:0;line-height:1.35;margin:4px 0 10px}
</style>

async function loadProfile(){
  if(S.preview || !S.user){ S.profile=null; S.isVip=false; S.isAdmin=false; S.vipUntil=null; return; }
  let { data, error } = await S.sb.rpc('my_profile');

  S.isAdmin = !!data?.is_admin;
  S.profile = data;
  S.vipUntil = data?.vip_until ? new Date(data.vip_until) : null;
  S.isVip = !!data?.is_vip || !!data?.is_admin || (!!S.vipUntil && S.vipUntil > new Date());
}
async function loadVolumes(){
  if(S.preview){ S.volumes=PREVIEW.volumes; return; }
  const { data, error } = await S.sb.from('volumes').select('*').order('sort');

async function loadPages(volId, force){
  if(S.pages[volId] && !force) return S.pages[volId];
  if(S.preview){ S.pages[volId]=PREVIEW.pages.filter(p=>p.volume_id===volId); return S.pages[volId]; }
  const { data, error } = await S.sb.from('pages').select('id,volume_id,sort,numeral,title,tier,teaser,page_bodies(body)').eq('volume_id',volId).order('sort');
  if(error) toast('Could not open this.');
  S.pages[volId] = (data||[]).map(p=>({...p, body: Array.isArray(p.page_bodies) ? p.page_bodies[0]?.body : p.page_bodies?.body }));
  return S.pages[volId];
}

/* ---- File items on the Shelf (PDF / audio / video) ---- */
function embedUrl(u){
  const y = String(u).match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/);
  if(y) return 'https://www.youtube-nocookie.com/embed/'+y[1];
  const m = String(u).match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(m) return 'https://player.vimeo.com/video/'+m[1];
  return null;
}
async function fileUrl(f){
  if(!f.file_path) return '';
  if(f.bucket==='shelf-public') return S.sb.storage.from('shelf-public').getPublicUrl(f.file_path).data.publicUrl;
  const { data } = await S.sb.storage.from('shelf-sealed').createSignedUrl(f.file_path, 3600);
  return data?.signedUrl || '';
}
async function mediaHtml(v, f){
  if(v.kind==='video' && f.video_url){
    const e = embedUrl(f.video_url);
    return e ? `<div class="vidwrap"><iframe src="${esc(e)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`
             : `<div class="row" style="justify-content:center"><a class="btn solid" href="${esc(f.video_url)}" target="_blank" rel="noopener">Watch</a></div>`;
  }
  const url = await fileUrl(f);
  if(!url) return '<p class="item-desc">This file could not be opened. Try again in a moment.</p>';
  if(v.kind==='pdf') return `<iframe class="media pdf" src="${esc(url)}#view=FitH" title="${esc(v.title)}"></iframe>
    <div class="row" style="justify-content:center"><a class="btn solid" href="${esc(url)}" target="_blank" rel="noopener">Open Full Screen</a></div>`;
  if(v.kind==='audio') return `<audio class="media" controls preload="metadata" src="${esc(url)}"></audio>`;
  if(v.kind==='video') return `<video class="media" controls playsinline preload="metadata" src="${esc(url)}"></video>`;
  return '';
}

/* ---- Admin: Add to Shelf ---- */
function adminTabs(which){ return `<div class="tabs" role="tablist" style="margin-bottom:16px"><button class="${which==='shelf'?'on':''}" onclick="location.hash='#/admin'">SHELF</button><button class="${which==='members'?'on':''}" onclick="location.hash='#/admin/members'">MEMBERS</button></div>`; }
async function viewAdmin(){
  renderNav('admin');
  if(!admin()){ location.hash='#/shelf'; return; }
  $app.innerHTML = header()+'<div class="empty">Opening the workshop…</div>';
  await loadVolumes();
  const items = S.preview ? S.volumes : (S.allVolumes||[]);
  $app.innerHTML = header()+adminTabs('shelf')+`<div class="hero"><h1>Add to the Shelf</h1><p>Upload a file or link a video. It appears on the Shelf the moment you publish.</p></div>
  <div class="panel">
    <label for="nTitle">Title</label><input id="nTitle" maxlength="80" placeholder="e.g. The Night Watch Meditation">
    <label for="nDesc">Short description</label><input id="nDesc" maxlength="120" placeholder="One line shown on the card">
    <label for="nKind">Type</label><select id="nKind">
      <option value="pdf">PDF</option><option value="audio">Audio</option>
      <option value="video-link">Video — YouTube or Vimeo link</option><option value="video">Video — upload a file</option></select>
    <label for="nTier">Who can open it</label><select id="nTier"><option value="vip">Keyholders only</option><option value="member">Members (free account) and Keyholders</option><option value="free">Free for everyone</option></select>
    <div id="nFileWrap"><label for="nFile">File</label><input id="nFile" type="file" accept="application/pdf"><p style="font-size:15px;margin:6px 0 0">Up to 50 MB per file on Supabase's free plan.</p></div>
    <div id="nUrlWrap" class="hidden"><label for="nUrl">Video link</label><input id="nUrl" type="url" placeholder="https://youtu.be/…"><p style="font-size:15px;margin:6px 0 0">Tip: set the YouTube video to Unlisted so it only plays here.</p></div>
    <div class="row"><button class="btn vip solid" id="nGo">Publish to Shelf</button></div>
  </div>
  <div class="section-title" style="margin-top:22px">On the Shelf</div>
  <div class="panel">${items.length ? items.map(v=>`<div class="adm-item"><div><b>${esc(v.title)}</b>
     <span class="meta">${esc(KIND_LABEL[v.kind||'booklet']||'')} · ${TIER_LABEL[v.tier||'free']}${v.status==='hidden'?' · HIDDEN':''}</span></div>
     <div class="btns"><button class="btn" data-toggle="${esc(v.id)}">${v.status==='hidden'?'Show':'Hide'}</button>
     ${isFileItem(v)?`<button class="btn danger" data-del="${esc(v.id)}">Delete</button>`:''}</div></div>`).join('') : '<div class="empty">Nothing yet.</div>'}</div>`;

  const kindSel=document.getElementById('nKind');
  kindSel.onchange=()=>{
    const k=kindSel.value, link=k==='video-link';
    document.getElementById('nFileWrap').classList.toggle('hidden',link);
    document.getElementById('nUrlWrap').classList.toggle('hidden',!link);
    document.getElementById('nFile').accept = k==='pdf'?'application/pdf':k==='audio'?'audio/*':'video/*';
  };
  document.getElementById('nGo').onclick=async()=>{
    const btn=document.getElementById('nGo');
    const title=document.getElementById('nTitle').value.trim(), desc=document.getElementById('nDesc').value.trim();
    const k=kindSel.value, tier=document.getElementById('nTier').value, kind = k==='video-link'?'video':k;
    if(!title) return toast('Give it a title.');
    if(S.preview) return toast('Preview mode: publishing turns on once Supabase is connected.');
    let bucket=null, file_path=null, video_url=null;
    if(k==='video-link'){
      video_url=document.getElementById('nUrl').value.trim();
      if(!/^https?:\/\//i.test(video_url)) return toast('Paste the full video link (starting with https://).');
    } else {
      const file=document.getElementById('nFile').files[0];
      if(!file) return toast('Choose a file to upload.');
      if(file.size > 50*1024*1024) return toast('That file is over 50 MB. Compress it, or use a video link instead.');
      bucket = tier==='free' ? 'shelf-public' : 'shelf-sealed';
      const ext = (file.name.match(/\.[a-z0-9]+$/i)||[''])[0].toLowerCase();
      file_path = `${Date.now()}-${slug(file.name.replace(/\.[^.]+$/,''))}${ext}`;
      btn.disabled=true; btn.textContent='Uploading…';
      const { error } = await S.sb.storage.from(bucket).upload(file_path, file, { contentType: file.type || undefined, upsert:false });
      if(error){ btn.disabled=false; btn.textContent='Publish to Shelf'; return toast('Upload failed: '+error.message); }
    }
    btn.disabled=true; btn.textContent='Publishing…';
    const id = slug(title)+'-'+Date.now().toString(36).slice(-4);
    const sort = Math.max(0, ...items.map(i=>i.sort||0)) + 1;
    const r1 = await S.sb.from('volumes').insert({ id, numeral:'', title, subtitle:desc, status:'live', sort, kind, tier });
    const r2 = r1.error ? r1 : await S.sb.from('shelf_files').insert({ volume_id:id, bucket, file_path, video_url });
    if(r1.error || r2.error){
      if(file_path) await S.sb.storage.from(bucket).remove([file_path]);
      if(!r1.error) await S.sb.from('volumes').delete().eq('id',id);
      btn.disabled=false; btn.textContent='Publish to Shelf';
      return toast('Could not publish: '+(r1.error||r2.error).message);
    }
    toast('Published to the Shelf.'); viewAdmin();
  };
  $app.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{
    if(S.preview) return toast('Preview mode.');
    const v=items.find(x=>x.id===b.dataset.toggle);
    const { error } = await S.sb.from('volumes').update({ status: v.status==='hidden'?'live':'hidden' }).eq('id',v.id);
    if(error) return toast(error.message); viewAdmin();
  });
  $app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(S.preview) return toast('Preview mode.');
    const v=items.find(x=>x.id===b.dataset.del);
    if(!confirm(`Delete "${v.title}" from the Shelf? This also deletes the file.`)) return;
    const { data:f } = await S.sb.from('shelf_files').select('bucket,file_path').eq('volume_id',v.id).maybeSingle();
    if(f?.file_path && f?.bucket) await S.sb.storage.from(f.bucket).remove([f.file_path]);
    const { error } = await S.sb.from('volumes').delete().eq('id',v.id);
    if(error) return toast(error.message); toast('Deleted.'); viewAdmin();
  });
}

      <b>${esc(r.display_name||'—')}</b>

/* ---- Guild Hall (VIP forum) ---- */
let guildCat = null;
async function loadCats(){
  if(S.preview){ S.cats=PREVIEW.categories; return; }
  const { data } = await S.sb.from('forum_categories').select('*').order('sort'); S.cats=data||[];
}
async function viewGuild(){
  renderNav('guild');
  if(!signedIn()){ $app.innerHTML=header()+`<div class="hero"><h1>The Guild Hall</h1><p>Where the guild gathers.</p></div>`+joinGate('Members Only','Create a free account to step into the Guild Hall.'); return; }
  $app.innerHTML=header()+'<div class="empty">Opening the hall…</div>';
  await loadCats();
  const full = vip() || admin();
  const open = S.cats.filter(c=>full || c.tier==='member');
  const sealedCat = id => { const c=S.cats.find(x=>x.id===id); return c && c.tier!=='member' && !full; };
  if(guildCat && !S.cats.some(c=>c.id===guildCat)) guildCat=null;
  let threads=[], teasers=[];
  if(S.preview){
    const all=PREVIEW.threads.filter(t=>!guildCat||t.category_id===guildCat);
    threads=all.filter(t=>!sealedCat(t.category_id)); teasers=all.filter(t=>sealedCat(t.category_id));
  } else {
    if(!guildCat || !sealedCat(guildCat)){
      let q=S.sb.from('forum_threads').select('id,title,created_at,category_id,author:profiles(display_name),forum_posts(count)').order('created_at',{ascending:false}).limit(50);
      if(guildCat) q=q.eq('category_id',guildCat);
      const { data, error } = await q; if(error) toast('Could not load discussions.'); threads=data||[];
    }
    if(!full){
      const { data } = await S.sb.rpc('guild_teasers');
      teasers=(data||[]).filter(t=>!guildCat||t.category_id===guildCat);
    }
  }
  const catName = id => S.cats.find(c=>c.id===id)?.name || '';
  const replies = t => S.preview?(t.posts||[]).length:(t.forum_posts?.[0]?.count ?? t.replies ?? 0);
  $app.innerHTML=header()+`<div class="hero"><h1>The Guild Hall</h1><p>Speak freely. Mind your business — and each other's back.</p></div>
  ${full?'':`<div class="panel" style="border-color:var(--vip);text-align:center"><p style="margin:0">You're in the open rooms. The sealed rooms 🔒 are where Keyholders go deeper.</p></div>`}
  <div class="cat-chips"><button class="chip ${!guildCat?'on':''}" data-c="">All</button>${S.cats.map(c=>`<button class="chip ${guildCat===c.id?'on':''}" data-c="${c.id}">${sealedCat(c.id)?'🔒 ':''}${esc(c.name)}</button>`).join('')}</div>
  ${open.length?`<div class="row" style="margin:0 0 14px"><button class="btn vip" id="newT">+ Start a Discussion</button></div>
  <div id="newForm" class="panel hidden"><h2>New Discussion</h2>
    <label for="tCat">Room</label><select id="tCat">${open.map(c=>`<option value="${c.id}" ${guildCat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
    <label for="tTitle">Title</label><input id="tTitle" maxlength="140">
    <label for="tBody">Message</label><textarea id="tBody" maxlength="5000"></textarea>
    <div class="row"><button class="btn solid" id="tPost">Post</button><button class="btn" id="tCancel">Cancel</button></div></div>`:''}
  ${threads.map(t=>{const n=replies(t);return `<button class="thread" data-t="${t.id}"><h3>${esc(t.title)}</h3>
   <div class="meta">${esc(t.author?.display_name||'Member')} · ${esc(catName(t.category_id))} · ${when(t.created_at)} · ${n} ${n===1?'reply':'replies'}</div></button>`}).join('')}
  ${teasers.map(t=>{const n=replies(t);return `<button class="thread sealed" data-lock="1"><h3>🔒 ${esc(t.title)}</h3>
   <div class="meta">${esc(catName(t.category_id))} · ${when(t.created_at)} · ${n} ${n===1?'reply':'replies'} · Keyholders only</div></button>`}).join('')}
  ${!threads.length&&!teasers.length?'<div class="empty">No discussions yet. Light the first lantern.</div>':''}
  ${full?'':vipGate('Hear the Rest','Keyholders read and speak in every room of the Guild Hall.')}`;
  $app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{guildCat=b.dataset.c?+b.dataset.c:null;viewGuild();});
  $app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>location.hash='#/guild/'+b.dataset.t);
  $app.querySelectorAll('[data-lock]').forEach(b=>b.onclick=()=>{ toast('That room is sealed for Keyholders.'); location.hash='#/account'; });
  const f=document.getElementById('newForm');
  if(!f) return;
  document.getElementById('newT').onclick=()=>f.classList.remove('hidden');
  document.getElementById('tCancel').onclick=()=>f.classList.add('hidden');
  document.getElementById('tPost').onclick=async()=>{
    const title=document.getElementById('tTitle').value.trim(), body=document.getElementById('tBody').value.trim(), cat=+document.getElementById('tCat').value;
    if(!title||!body) return toast('Add a title and a message.');
    if(S.preview) return toast('Preview mode: posting turns on once Supabase is connected.');
    const { error } = await S.sb.from('forum_threads').insert({title,body,category_id:cat,author_id:S.user.id});
    if(error) return toast('Could not post: '+error.message);
    toast('Posted to the Guild Hall.'); viewGuild();
  };
}
async function viewThread(id){
  renderNav('guild');
  if(!signedIn()) return viewGuild();
  let t, posts;
  if(S.preview){ t=PREVIEW.threads.find(x=>x.id===+id); posts=t?.posts||[];
    if(t && !vip() && PREVIEW.categories.find(c=>c.id===t.category_id)?.tier!=='member') t=null; }
  else {
    const r1 = await S.sb.from('forum_threads').select('id,title,body,created_at,author:profiles(display_name)').eq('id',id).maybeSingle(); t=r1.data;
    const r2 = await S.sb.from('forum_posts').select('id,body,created_at,author:profiles(display_name)').eq('thread_id',id).order('created_at'); posts=r2.data||[];
  }
  if(!t){ $app.innerHTML=header()+'<div class="empty">Discussion not found.</div>'; return; }
  $app.innerHTML=header()+`<div class="reader-head"><button class="back" onclick="location.hash='#/guild'">‹ GUILD HALL</button></div>
  <div class="panel"><h2 style="font-family:'Cormorant Garamond';font-size:23px;letter-spacing:0">${esc(t.title)}</h2>
   <div class="meta">${esc(t.author?.display_name||'Member')} · ${when(t.created_at)}</div>
   <div class="post" style="border-color:var(--vip)"><div class="txt">${esc(t.body)}</div></div>
   ${posts.map(p=>`<div class="post"><div class="who">${esc(p.author?.display_name||'Member')} <span class="meta">· ${when(p.created_at)}</span></div><div class="txt">${esc(p.body)}</div></div>`).join('')||'<div class="empty">No replies yet.</div>'}
  </div>
  <div class="panel"><label for="rBody">Your reply</label><textarea id="rBody" maxlength="5000"></textarea><div class="row"><button class="btn solid" id="rPost">Reply</button></div></div>`;
  document.getElementById('rPost').onclick=async()=>{
    const body=document.getElementById('rBody').value.trim(); if(!body) return;
    if(S.preview) return toast('Preview mode: replies turn on once Supabase is connected.');
    const { error } = await S.sb.from('forum_posts').insert({thread_id:+id,body,author_id:S.user.id});
    if(error) return toast('Could not reply: '+error.message);
    viewThread(id);
  };
}

  return `${signedIn()&&!S.preview?`<div class="panel"><h2>Email Updates</h2><p>${opt?'You\'re getting new releases and Guild news by email.':'Get new releases and Guild news by email.'}</p>
    <div class="row"><button class="btn" id="optBtn" aria-pressed="${opt}">${opt?'Stop emailing me':'Yes, email me'}</button></div></div>`:''}
  <div class="panel"><h2>Display</h2><p>Make text larger across the whole app.</p>
    <div class="row"><button class="btn" id="bigText" aria-pressed="${big}">${big?'Use normal text':'Use larger text'}</button></div></div>`;
}
function bindPrefs(){
  const o=document.getElementById('optBtn');
  if(o) o.onclick=async()=>{ const on=!S.profile?.marketing_opt_in; const { error } = await S.sb.rpc('set_my_opt_in',{p_on:on});
    if(error) return toast(error.message); S.profile.marketing_opt_in=on; toast(on?'You\'re on the list.':'You won\'t get update emails.'); viewAccount(); };
  const b=document.getElementById('bigText'); if(!b) return;
  b.onclick=()=>{ const on=!document.documentElement.classList.contains('big'); document.documentElement.classList.toggle('big',on); store('mobvault.bigtext',on); viewAccount(); };
}

/* ---- Crypto guide ---- */
function viewCryptoGuide(){
  renderNav('account');
  $app.innerHTML=header()+`<div class="reader-head"><button class="back" onclick="history.length>1?history.back():location.hash='#/account'">‹ BACK</button></div>
  <div class="hero"><h1>Paying With Crypto</h1><p>Never done it? You can be done in about 5 minutes.</p></div>
  <div class="panel start" style="text-align:left"><p style="color:var(--ink);margin:0"><strong>Remember:</strong> you do <strong>not</strong> need crypto to join free. Crypto is only for becoming a Keyholder, the Codex pre-order, or a donation.</p></div>
  <div class="panel guide"><h2>1 · Get a wallet app</h2>
    <p>A wallet is an app on your phone that holds Bitcoin. Pick <strong>one</strong>:</p>
    <ul>
      <li><strong>Easiest — Cash App</strong> (iPhone & Android, US). If you already use Cash App, you already have a Bitcoin wallet. Just open the <strong>Bitcoin</strong> section of the app.</li>
      <li><strong>Also easy — Coinbase</strong> or <strong>Strike</strong>. Download from the App Store or Google Play and sign up with your ID.</li>
      <li><strong>Own your keys — BlueWallet</strong> or <strong>Exodus</strong>. No account needed. When it shows you a list of 12 or 24 words (your <em>recovery phrase</em>), write them on paper and keep them safe. Anyone with those words can take your coins, and if you lose them, no one can recover your wallet.</li>
    </ul></div>
  <div class="panel guide"><h2>2 · Buy a little Bitcoin</h2>
    <p>In the app, tap <strong>Buy</strong>, choose Bitcoin, and pay with your debit card or bank. Buy a few dollars more than the price (for example <strong>$25</strong> for a ${esc(CONFIG.VIP_PRICE_LABEL)} membership) to cover the small network fee. If you use BlueWallet or Exodus, buy in Cash App, Coinbase or Strike first, then send it to your wallet.</p></div>
  <div class="panel guide"><h2>3 · Tap the pay button here</h2>
    <p>Come back to the Vault and tap <strong>Join with Crypto</strong> (or the Codex or donation button). Enter <strong>the same email you used for your Vault account</strong> and choose Bitcoin. You'll see a <strong>QR code</strong>, an <strong>address</strong> and an <strong>exact amount</strong>.</p></div>
  <div class="panel guide"><h2>4 · Send it</h2>
    <ol>
      <li>In your wallet app, open Bitcoin and tap <strong>Send</strong>.</li>
      <li>Tap the <strong>scan</strong> icon and scan the QR code. (On one phone? Tap <strong>copy</strong> on the address and paste it into your wallet.)</li>
      <li>Make sure the amount matches <strong>exactly</strong>, then confirm.</li>
    </ol>
    <p>Keep the checkout page open until it says the payment was received.</p></div>
  <div class="panel guide"><h2>5 · Get your Vault key</h2>
    <p>Bitcoin payments usually confirm in 10–60 minutes. Your <strong>Vault key</strong> then arrives at the email you entered. Open <strong>Account</strong>, paste the key into <strong>Have a Vault Key?</strong> and tap <strong>Unlock</strong>. That's it.</p></div>
  <div class="panel guide"><h2>Good to know</h2>
    <ul>
      <li><strong>Crypto payments can't be reversed.</strong> Double-check the amount and address before sending.</li>
      <li><strong>Never share your recovery phrase</strong> — not with us, not with anyone. We will never ask for it.</li>
      <li>Bitcoin's price moves. The checkout locks the amount for a short time; if it expires, just start again.</li>
      <li>Stuck? Email <a href="mailto:${esc(CONFIG.ADMIN_EMAIL)}">${esc(CONFIG.ADMIN_EMAIL)}</a> with your checkout email and we'll help.</li>
    </ul></div>
  ${footer()}`;
}

/* ---- Account ---- */
let authTab='up';
function viewAccount(){
  renderNav('account');
  if(!signedIn()){
    $app.innerHTML=header()+`<div class="hero"><h1>Enter the Vault</h1><p>Step 1 is free. Step 2 is optional.</p></div>
    <div class="panel start" style="text-align:left"><h2 style="text-align:center">How it works</h2>
      <p style="color:var(--ink)"><strong>Step 1 · Join free.</strong> Make an account below with your email. No payment and no crypto. You instantly get more of Destiny Lock, your Shadow Journal and the Guild Hall.</p>
      <p style="color:var(--ink);margin:0"><strong>Step 2 · Become a Keyholder (optional).</strong> When you want everything, pay ${esc(CONFIG.VIP_PRICE_LABEL)} with crypto. <a href="#/guide/crypto"><u>Never used crypto? Here's how.</u></a></p></div>
    <div class="panel"><div class="tabs" role="tablist"><button class="${authTab==='up'?'on':''}" data-tab="up" role="tab" aria-selected="${authTab==='up'}">JOIN FREE</button><button class="${authTab==='in'?'on':''}" data-tab="in" role="tab" aria-selected="${authTab==='in'}">SIGN IN</button></div>
     ${authTab==='up'?'<label for="aName">Display name</label><input id="aName" maxlength="40" autocomplete="nickname">':''}
     <label for="aEmail">Email</label><input id="aEmail" type="email" autocomplete="email">
     <label for="aPass">Password</label><input id="aPass" type="password" autocomplete="${authTab==='up'?'new-password':'current-password'}" minlength="8">
     ${authTab==='up'?'<label class="optin" for="aOpt"><input type="checkbox" id="aOpt"> Yes, email me new releases and Guild news. Unsubscribe any time.</label>':''}
     ${authTab==='up'?'<p style="font-size:15px;margin:10px 0 0">By creating an account you agree to the <a href="'+esc(legalHref('terms'))+'"><u>Terms</u></a> and <a href="'+esc(legalHref('privacy'))+'"><u>Privacy Policy</u></a>. After you sign up, check your email and tap the confirmation link.</p>':''}
     <div class="row"><button class="btn solid big" id="aGo">${authTab==='up'?'Create My Free Account':'Sign In'}</button>${authTab==='in'?'<button class="btn" id="aForgot"><u>Forgot password</u></button>':''}</div></div>
    ${vipPanel()}${prefsPanel()}${footer()}`;
    bindPrefs();
    $app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{authTab=b.dataset.tab;viewAccount();});
    document.getElementById('aGo').onclick=doAuth;
    const fg=document.getElementById('aForgot'); if(fg) fg.onclick=async()=>{
      const email=document.getElementById('aEmail').value.trim(); if(!email) return toast('Enter your email first.');
      if(S.preview) return toast('Preview mode.');
      const { error } = await S.sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin}); toast(error?error.message:'Check your email for a reset link.');
    };
    return;
  }
  $app.innerHTML=header()+`<div class="hero"><h1>${esc(displayName())}</h1><p>${vip()?'Keyholder':'Free Member'}</p></div>
  ${vip()?`<div class="panel" style="border-color:var(--vip)"><h2 style="color:var(--vip)">Keyholder · Active</h2>

   <label for="code">Vault key</label><input id="code" placeholder="MOB-XXXX-XXXX" autocapitalize="characters">
   <div class="row"><button class="btn vip" id="redeem">Redeem Key</button></div></div>`:`
  <div class="panel" style="border-color:var(--vip)"><h2 style="color:var(--vip)">Become a Keyholder · ${esc(CONFIG.VIP_PRICE_LABEL)}</h2>
   <p>Unlock every sealed page on the Shelf, the private Shadow Journal, and the Guild Hall members' forum.</p>
   <p>Each payment unlocks <strong>30 days</strong> of Keyholder access.</p>
   ${payButton(CONFIG.PAY.membership,'Join with Crypto')}

  <div class="panel"><h2>Have a Vault Key?</h2><p>Codex pre-order buyers: your key is in your order email.</p>
   <label for="code">Vault key</label><input id="code" placeholder="MOB-XXXX-XXXX" autocapitalize="characters">
   <div class="row"><button class="btn vip" id="redeem">Unlock</button></div></div>`}
  ${S.preview?`<div class="panel"><h2>Preview Controls</h2><p>Flip Keyholder access on and off to see both experiences.</p><div class="row"><button class="btn vip" id="demoVip">${S.demoVip?'Turn Keyholder off':'Preview as Keyholder'}</button><button class="btn" id="demoAdmin">${S.demoAdmin?'Turn admin off':'Preview as admin'}</button></div></div>`:''}
  ${prefsPanel()}
  <div class="row"><button class="btn" id="out">Sign Out</button></div>${footer()}`;
  bindPrefs();
  const r=document.getElementById('redeem'); if(r) r.onclick=redeem;
  const dv=document.getElementById('demoVip'); if(dv) dv.onclick=()=>{S.demoVip=!S.demoVip;viewAccount();};
  const da=document.getElementById('demoAdmin'); if(da) da.onclick=()=>{S.demoAdmin=!S.demoAdmin;viewAccount();};
  document.getElementById('out').onclick=async()=>{ if(S.preview){S.demoUser=false;S.demoVip=false;S.demoAdmin=false;} else await S.sb.auth.signOut(); location.hash='#/shelf'; };
}
async function doAuth(){
  const email=document.getElementById('aEmail').value.trim(), pass=document.getElementById('aPass').value;
  if(!email||pass.length<8) return toast('Enter your email and a password of 8+ characters.');
  if(S.preview){ S.demoUser=true; toast('Preview: signed in.'); return viewAccount(); }
  if(authTab==='up'){
    const name=(document.getElementById('aName').value.trim()||email.split('@')[0]).slice(0,40);
    const { data, error } = await S.sb.auth.signUp({email,password:pass,options:{data:{display_name:name, marketing_opt_in: !!document.getElementById('aOpt')?.checked},emailRedirectTo:location.origin}});
    if(error) return toast(error.message);
    if(!data.session) return toast('Check your email to confirm your account.');
  } else {
    const { error } = await S.sb.auth.signInWithPassword({email,password:pass});
    if(error) return toast(error.message);
  }
}
async function redeem(){
  const code=document.getElementById('code').value.trim().toUpperCase(); if(!code) return;
  if(S.preview){ S.demoVip=true; toast('Preview: Keyholder unlocked.'); return viewAccount(); }
  const { data, error } = await S.sb.rpc('redeem_vip_code',{p_code:code});
  if(error) return toast(error.message);
  if(!data) return toast('That key is invalid or already used.');
  await loadProfile(); S.pages={}; toast('Welcome, Keyholder.'); viewAccount();
}

/* ============ ROUTER ============ */
async function route(){
  window.scrollTo(0,0);
  const parts=(location.hash||'#/shelf').slice(2).split('/');
  try{
    if(parts[0]==='read') return await viewReader(decodeURIComponent(parts[1]), +parts[2]||0);
    if(parts[0]==='guild') return parts[1] ? await viewThread(parts[1]) : await viewGuild();
    if(parts[0]==='item') return await viewItem(decodeURIComponent(parts[1]));
    if(parts[0]==='admin') return parts[1]==='members' ? await viewMembers() : await viewAdmin();
    if(parts[0]==='guide') return viewCryptoGuide();
    if(parts[0]==='legal') return viewLegal(parts[1]);
    if(parts[0]==='journal') return viewJournal();
    if(parts[0]==='account') return viewAccount();
    return await viewShelf();
  }catch(e){ console.error(e); $app.innerHTML=header()+'<div class="empty">Something went wrong. Pull down to refresh.</div>'; }
}

/* ============ BOOT ============ */
(async function init(){
  applyTheme();
  if(store('mobvault.bigtext')) document.documentElement.classList.add('big');
  S.preview = CONFIG.SUPABASE_URL.includes('YOUR-') || !window.supabase;
  if(!S.preview){
    S.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    const { data } = await S.sb.auth.getSession(); S.user = data.session?.user || null;
    await loadProfile();
    S.sb.auth.onAuthStateChange(async (_e, session)=>{
      const was=S.user?.id; S.user=session?.user||null;
      if(was!==S.user?.id){ await loadProfile(); S.pages={}; route(); }
    });
  }
  window.addEventListener('hashchange', route);
  route();
  if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
