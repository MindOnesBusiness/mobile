<style>
:root{
  --desk:#0E1C19; --bar:#0B1714; --green:#152C28; --panel:#17302B; --ivory:#F3EFE5; --gold:#B79B62; --gold-hi:#E3CE96; --gold-ink:#74602F; --char:#202423;
  --text:#ECE6D8; --muted:#A3ADA6; --line:rgba(183,155,98,.30); --danger:#E7A193;
  --foil:linear-gradient(115deg,#7d6330 0%,#c9ad6e 18%,#f6e7b8 32%,#b79b62 48%,#8c7038 62%,#ead59e 80%,#a5884d 100%);
  --serif:'Marcellus','Cinzel',Georgia,'Times New Roman',serif; --caps:'Cinzel','Marcellus',Georgia,serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --nav:70px; --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
html{background:var(--desk)}
body{background:radial-gradient(ellipse 130% 55% at 50% 0%,#1d3a33 0%,var(--desk) 62%) fixed,var(--desk);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.2;color:var(--text)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--gold-hi);font-weight:600;text-underline-offset:3px}
.app{max-width:640px;margin:0 auto;min-height:100%;padding:0 16px calc(var(--nav) + env(safe-area-inset-bottom) + 24px)}

/* gold foil */
.foil,.hero h1,.vipcard h2,.stats b,.rite,.brand b{background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

/* header */
.top{position:relative;background:var(--bar);margin:0 -16px 18px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--foil)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:42px;height:42px;display:block}
.brand b{display:block;font-family:var(--caps);font-weight:600;font-size:19px;letter-spacing:.14em;line-height:1.1}
.brand small{display:block;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.badge{font-family:var(--caps);font-weight:700;font-size:11px;letter-spacing:.14em;padding:6px 12px;border-radius:999px;border:1px solid var(--gold);color:var(--gold-hi);white-space:nowrap}
.badge.vip,.badge.admin{background:var(--foil);color:var(--char);border-color:transparent;box-shadow:0 0 14px rgba(227,206,150,.25)}
.preview-bar{font-size:13px;font-weight:600;text-align:center;padding:8px;border:1px dashed var(--danger);border-radius:10px;color:var(--danger);margin-bottom:14px}

/* type */
.hero{margin:4px 0 18px}
.hero h1{font-size:32px;display:inline-block}
.hero p{color:var(--muted);margin-top:4px}
.eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--caps);font-weight:600;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-hi);margin:24px 0 12px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--foil);opacity:.8}
.note{font-size:15px;color:var(--muted)}
.banner{display:block;width:100%;border-radius:var(--r);background:#050d0b;margin-bottom:14px;border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.45)}

/* cards (dark leather) */
.card{background:linear-gradient(180deg,#19342F,#132925);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.card h2{font-size:23px;margin-bottom:8px}
.card p{margin-bottom:10px}.card p:last-child{margin-bottom:0}
.card.dark{background:#0F211D}
.card.vipcard{border:1px solid transparent;background:linear-gradient(180deg,#19342F,#10241F) padding-box,var(--foil) border-box;box-shadow:0 12px 34px rgba(0,0,0,.45),0 0 28px rgba(227,206,150,.08)}
.card.dash{border-style:dashed;box-shadow:none;background:transparent}
/* paper (ivory): reading and writing surfaces */
.paper,.card.paper,.card.legal,.page-card{background:var(--ivory);color:var(--char);border:1px solid #d9cfb8;box-shadow:0 14px 34px rgba(0,0,0,.5),0 2px 0 rgba(0,0,0,.25)}
.paper h1,.paper h2,.paper h3,.card.legal h2,.page-card h2{color:var(--green)}
.paper a,.card.legal a,.page-card a{color:var(--green)}
.paper .note,.paper .meta,.card.legal .note{color:#5E615C}
.paper label{color:var(--char)}
.paper .who{color:var(--char)} .paper .who .un{color:#5E615C}

.ticks{list-style:none;margin:8px 0 12px}
.ticks li{padding-left:26px;position:relative;margin:6px 0}
.ticks li::before{content:"";position:absolute;left:2px;top:9px;width:12px;height:7px;border-left:2px solid var(--gold-hi);border-bottom:2px solid var(--gold-hi);transform:rotate(-45deg)}
.steps{list-style:none;counter-reset:s;margin:6px 0}
.steps li{counter-increment:s;padding-left:44px;position:relative;margin:12px 0}
.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);color:var(--gold-hi);font-family:var(--caps);font-weight:700;display:flex;align-items:center;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:10px;border:0;background:var(--foil);background-size:140% 100%;color:var(--char);
  font-family:var(--sans);font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;min-height:48px;transition:background-position .4s,filter .15s;text-align:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.25),0 4px 14px rgba(0,0,0,.3)}
.btn:hover{background-position:100% 0;filter:brightness(1.06)}
a.btn,.card a.btn{color:var(--char)}
.btn.outline{background:transparent;color:var(--gold-hi);border:1px solid var(--gold);box-shadow:none}
.card a.btn.outline{color:var(--gold-hi)}
.paper .btn.outline,.paper a.btn.outline{color:var(--green);border-color:var(--green)}
.btn.gold{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 22px rgba(227,206,150,.22),0 4px 14px rgba(0,0,0,.35)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);box-shadow:none}
.paper .btn.danger{color:#9B2C2C;border-color:#9B2C2C}
.btn.small{min-height:44px;padding:6px 14px;font-size:14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px;color:var(--text)}
input,textarea,select{width:100%;background:#0D1E1A;border:1px solid rgba(183,155,98,.38);border-radius:10px;padding:11px 13px;font-size:16px;color:var(--text)}
input::placeholder,textarea::placeholder{color:#7f8a84}
select option{background:#0D1E1A;color:var(--text)}
.paper input,.paper textarea,.paper select{background:#fff;color:var(--char);border-color:#cfc6b3}
.paper input::placeholder,.paper textarea::placeholder{color:#8a8a84}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold-hi);box-shadow:0 0 0 3px rgba(183,155,98,.25)}
input[type=file]{padding:8px}
textarea{min-height:110px;resize:vertical}
.count{font-size:13px;color:var(--muted);text-align:right;margin-top:4px}
.tabs{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:6px}
.tabs button{flex:1;background:transparent;border:0;padding:10px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--foil);color:var(--char)}
.optin{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:15px;margin:14px 0 0;cursor:pointer}
.optin input{width:20px;height:20px;flex:none;margin-top:3px;accent-color:var(--gold)}
details.more{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
details.more summary{font-weight:600;cursor:pointer;color:var(--gold-hi)}
.paybtn{display:block;margin-top:10px}
.payopts{display:grid;gap:12px;margin-top:14px}
.payopt{border:1px solid var(--line);border-radius:12px;padding:14px;background:rgba(0,0,0,.18)}
.payopt b{display:block;font-family:var(--caps);letter-spacing:.12em;font-size:12px;color:var(--gold-hi);text-transform:uppercase;margin-bottom:6px}
.stepbar{border:1px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:16px;color:var(--gold-hi);font-weight:600;background:rgba(183,155,98,.08)}
.sale{display:inline-block;font-family:var(--caps);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:var(--foil);color:var(--char);border-radius:999px;padding:3px 10px;margin-bottom:8px}
blockonomics-pay-button:not(:defined)::before{content:"Loading the Bitcoin button…";font-style:italic;opacity:.75}

/* shelf rows */
.shelfrow{margin:0 -16px 8px;position:relative}
.shelfrow .eyebrow{margin:22px 16px 10px}
.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 16px;scroll-padding-left:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.poster{flex:none;width:156px;scroll-snap-align:start;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--text)}
.cover{position:relative;width:156px;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--green);box-shadow:0 10px 24px rgba(0,0,0,.5);transition:transform .2s,box-shadow .2s}
.poster:hover .cover,.poster:focus-visible .cover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.55),0 0 20px rgba(227,206,150,.15)}
.cover img.full{width:100%;height:100%;object-fit:cover;display:block}
.cover .ov{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 12px;background:linear-gradient(transparent,rgba(8,18,16,.92));color:var(--ivory);font-size:12.5px;line-height:1.35}
.cover.gen{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px 13px 14px;text-align:center;
  background:radial-gradient(circle at 50% 30%,#24453e,var(--green) 65%,#0f201c)}
.cover.gen::before{content:"";position:absolute;inset:0;border-radius:10px;padding:1px;background:var(--foil);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.cover.gen::after{content:"";position:absolute;inset:6px;border:1px solid rgba(183,155,98,.55);border-radius:6px;pointer-events:none}
.cover.gen .em{width:38px;height:38px}
.cover.gen .mid{display:flex;flex-direction:column;align-items:center;gap:8px}
.cover.gen .ct{font-family:var(--serif);font-size:19px;line-height:1.15;background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.cover.gen .cs{font-size:11.5px;line-height:1.35;color:#d7d2c4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cover.gen .ck{font-family:var(--caps);font-size:10px;letter-spacing:.18em;color:var(--gold-hi);text-transform:uppercase}
.cover .lock{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:var(--foil);color:var(--char);display:flex;align-items:center;justify-content:center;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.cover .lock svg{width:15px;height:15px}
.poster .pt{font-weight:600;font-size:14px;line-height:1.3;margin-top:9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.poster .pl{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-top:3px}
.poster .pl.vip{color:var(--gold-hi)}
.poster .pl svg{width:12px;height:12px}
.arrow{position:absolute;top:84px;width:36px;height:36px;border-radius:50%;border:1px solid var(--gold);background:rgba(11,23,20,.88);color:var(--gold-hi);
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;font-size:20px;line-height:1}
.arrow.l{left:6px}.arrow.r{right:6px}
@media (hover:none){.arrow{display:none}}
.soon{flex:none;width:156px;aspect-ratio:2/3;border:1px dashed var(--gold);border-radius:10px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;text-align:center;padding:12px;color:var(--muted);font-size:14px}
.soon b{font-family:var(--serif);font-weight:400;font-size:18px;color:var(--gold-hi)}

/* reader */
.reader-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.back{display:inline-flex;align-items:center;min-height:44px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:600;cursor:pointer;color:var(--text);text-decoration:none}
.counter{font-family:var(--caps);font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.reader-title{font-size:28px;margin-bottom:4px}
.pill{display:inline-block;white-space:nowrap;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--gold);color:var(--gold-hi)}
.pdfbox{overflow-x:auto;margin:12px 0}
.pdfpage{margin:0 0 18px;text-align:center}
.pdfpage canvas{display:block;margin:0 auto;border-radius:4px;background:#fff;box-shadow:0 16px 36px rgba(0,0,0,.55)}
.pdfpage figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.zoom{display:flex;gap:8px;flex-wrap:wrap}
.media.audio{width:100%;margin:8px 0}
video.media{width:100%;border-radius:var(--r);background:#000}
.vidwrap{position:relative;padding-top:56.25%;border-radius:var(--r);overflow:hidden}
.vidwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.page-card{border-radius:var(--r);padding:22px;min-height:50vh}
.page-card .body p{margin-bottom:12px}.page-card .body ul,.page-card .body ol{margin:0 0 12px 22px}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:12px}
.locked{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:8px 0}
.padlock{width:56px;height:56px;border-radius:50%;border:1px solid var(--gold);color:var(--gold-hi);display:flex;align-items:center;justify-content:center}
.padlock svg{width:24px;height:24px}

/* people */
.ava{flex:none;border-radius:50%;object-fit:cover;background:var(--green);color:var(--gold-hi);display:inline-flex;align-items:center;justify-content:center;font-family:var(--caps);font-weight:700;overflow:hidden;border:1px solid var(--line)}
.ava.vip{border:0;box-shadow:0 0 0 2px var(--desk),0 0 0 4px var(--gold-hi),0 0 16px rgba(227,206,150,.35)}
.paper .ava.vip{box-shadow:0 0 0 2px var(--ivory),0 0 0 4px var(--gold)}
.who{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.who b{font-weight:600}
.who .un{font-size:13px;color:var(--muted);font-weight:500}
.vipmark{font-family:var(--caps);font-size:10px;font-weight:700;letter-spacing:.12em;background:var(--foil);color:#141716;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.profile-hero{border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.profile-hero .band{height:86px;background:var(--green)}
.profile-hero .inner{padding:0 20px 20px;margin-top:-44px}
.profile-hero h1{font-size:26px;margin-top:10px}
.mission{font-family:var(--serif);font-size:19px;line-height:1.45;margin-top:10px;border-left:2px solid var(--gold);padding-left:12px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:44px;height:44px;border-radius:50%;border:2px solid var(--desk);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatches button.on{box-shadow:0 0 0 2px var(--gold-hi)}

/* lounge */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-bottom:6px}
.chip{flex:none;min-height:44px;border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:14px;font-weight:600;background:var(--panel);cursor:pointer;color:var(--text)}
.chip.on{background:var(--foil);color:var(--char);border-color:transparent}
.thread{display:block;width:100%;text-align:left;background:linear-gradient(180deg,#19342F,#132925);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;cursor:pointer;color:var(--text)}
.thread:hover{border-color:var(--gold)}
.thread.sealed{border-style:dashed;background:transparent;color:var(--muted)}
.thread h3{font-family:var(--sans);font-size:17px;font-weight:600;margin-bottom:6px;color:inherit}
.meta{font-size:13px;color:var(--muted)}

    <div class="track" data-n="${items.length}" data-loop="${loop?1:0}">${cards}</div></section>`;
}
function setupRows(){
  document.querySelectorAll('.shelfrow').forEach(row=>{
    const track=row.querySelector('.track'); const n=+track.dataset.n; const loop=track.dataset.loop==='1';
    const first=track.querySelector('.poster'); if(!first) return;
    const step = first.getBoundingClientRect().width + 14;
    if(loop){
      // Three copies of the row; we keep you in the middle copy so it never runs out.
      const setW = step*n;
      track.scrollLeft = setW;
      let t; track.addEventListener('scroll',()=>{ clearTimeout(t); t=setTimeout(()=>{
        if(track.scrollLeft < setW*0.5) track.scrollLeft += setW;
        else if(track.scrollLeft >= setW*1.5) track.scrollLeft -= setW; },140); },{passive:true});
    }
    row.querySelectorAll('.arrow').forEach(a=>a.onclick=()=>{
      const d=+a.dataset.dir;
      if(!loop && d>0 && track.scrollLeft + track.clientWidth >= track.scrollWidth - 4) return track.scrollTo({left:0,behavior:'smooth'});
      if(!loop && d<0 && track.scrollLeft <= 4) return track.scrollTo({left:track.scrollWidth,behavior:'smooth'});
      track.scrollBy({left:d*step,behavior:'smooth'});
    });
  });
}

/* ---- Items: PDF / audio / video ---- */
function embedUrl(u){
  const y = String(u).match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/);
  if(y) return 'https://www.youtube-nocookie.com/embed/'+y[1];
  const m = String(u).match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(m) return 'https://player.vimeo.com/video/'+m[1];
  return null;
}
async function fileUrl(f){
  if(!f || !f.file_path) return '';
  if(f.bucket==='site') return f.file_path;
  if(f.bucket==='shelf-public') return S.sb.storage.from('shelf-public').getPublicUrl(f.file_path).data.publicUrl;
  const { data } = await S.sb.storage.from('shelf-sealed').createSignedUrl(f.file_path, 3600);
  return data?.signedUrl || '';
}
async function pdfjs(){
  if(!window.__pdfjs){ const m = await import(CONFIG.PDFJS.lib); m.GlobalWorkerOptions.workerSrc = CONFIG.PDFJS.worker; window.__pdfjs = m; }
  return window.__pdfjs;
}
let pdfZoom = 1;
async function renderPdf(url, box){
  box.innerHTML = '<p class="empty">Opening…</p>';
  try{
    const lib = await pdfjs();
    const doc = await lib.getDocument({ url }).promise;
    box.innerHTML = '';
    const width = Math.min(box.clientWidth || 360, 900);
    for(let i=1;i<=doc.numPages;i++){
      const page = await doc.getPage(i);
      const base = page.getViewport({ scale:1 });
      const scale = (width - 8) / base.width * pdfZoom;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const vp = page.getViewport({ scale: scale * dpr });
      const fig = document.createElement('figure'); fig.className='pdfpage';
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
      c.style.width = (vp.width/dpr)+'px'; c.setAttribute('role','img'); c.setAttribute('aria-label',`Page ${i}`);
      const cap = document.createElement('figcaption'); cap.textContent = `Page ${i} of ${doc.numPages}`;
      fig.append(c, cap); box.appendChild(fig);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    }
  }catch(e){
    console.error(e);
    box.innerHTML = `<p class="empty">The guide did not open here.</p><div class="row" style="justify-content:center"><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Open the PDF</a></div>`;
  }
}
function upgradeNote(have, levels){
  const top = levels.reduce((a,t)=>RANK[t]>RANK[a]?t:a, have);
  if(RANK[top] <= RANK[have]) return '';
  if(have==='free' && levels.includes('member') && !signedIn())
    return `<div class="card" style="text-align:center"><h2>Read more</h2><p>This is the free part. Make a free account to read more.</p><a class="btn" href="#/account" onclick="authTab='up'">Make a Free Account</a></div>`;
  return `<div class="card vipcard" style="text-align:center"><h2>Read the whole guide</h2><p>VIP opens the whole guide and everything else in the Vault.</p><button class="btn gold" onclick="startVip('card')">Join VIP — $7/month</button></div>`;
}

function bindPdf(url){

}

async function resizeImage(file, size=320){
  const src=URL.createObjectURL(file);
  try{
    const img = await new Promise((ok,bad)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>bad(new Error('That image did not open. Try a JPG or PNG.')); i.src=src; });
    const s=Math.min(img.width,img.height), c=document.createElement('canvas'); c.width=c.height=size;
    c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);
    return await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.86));
  } finally { URL.revokeObjectURL(src); }
}

function bindProfile(){
  const bio=document.getElementById('pBio'); if(!bio) return;
  bio.oninput=()=>document.getElementById('pCount').textContent=`${bio.value.length} / ${bioLimit()}`;
  let accent = S.profile?.accent || null;
  document.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{ accent=b.dataset.acc||null; document.querySelectorAll('[data-acc]').forEach(x=>x.classList.toggle('on',x===b)); });
  const isV = vip()||admin();
  const save = async (extra={})=>{
    const p=S.profile||{};
    const args={ p_display_name: document.getElementById('pName').value.trim(), p_username: document.getElementById('pUser').value.trim()||null,
      p_bio: bio.value.trim()||null, p_avatar_url: ('avatar' in extra)?extra.avatar:(p.avatar_url||null),
      p_accent: isV?accent:null, p_link: isV?(document.getElementById('pLink').value.trim()||null):null };
    if(args.p_username && !/^[A-Za-z0-9_]{3,20}$/.test(args.p_username)) { toast('Usernames are 3 to 20 letters, numbers, or underscores.'); return false; }
    if(args.p_link && !/^https:\/\//i.test(args.p_link)) { toast('Links must start with https://'); return false; }
    if(S.preview){ Object.assign(S.profile,{display_name:args.p_display_name,username:args.p_username,bio:args.p_bio,accent:args.p_accent,link:args.p_link}); toast('Preview: profile saved.'); viewAccount(); return true; }
    const { error } = await S.sb.rpc('update_my_profile', args);
    if(error){ toast(error.message); return false; }
    await loadProfile(); toast('Profile saved.'); viewAccount(); return true;
  };
  document.getElementById('pSave').onclick=()=>save();
  const ph=document.getElementById('pPhoto');
  ph.onchange=async()=>{ const f=ph.files[0]; if(!f) return;
    if(S.preview) return toast('Preview mode: photo uploads work on the live app.');
    try{ const blob=await resizeImage(f); const path=`${S.user.id}/${Date.now()}.jpg`;
      const { error } = await S.sb.storage.from('avatars').upload(path, blob, { contentType:'image/jpeg', upsert:false }); if(error) throw error;
      const url=S.sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
      const old=S.profile?.avatar_url;
      if(await save({avatar:url})){ if(old && old.includes('/avatars/')){ const op=old.split('/avatars/')[1]; if(op) S.sb.storage.from('avatars').remove([op]); } }
      else S.sb.storage.from('avatars').remove([path]);
    }catch(e){ toast(e.message||'Photo upload failed.'); } };

async function doAuth(){
  const id=document.getElementById('aEmail').value.trim(), pass=document.getElementById('aPass').value;
  if(!id||pass.length<8) return toast('Enter your details and a password of 8 or more characters.');
  if(S.preview){ S.demoUser=true; toast('Preview: you are signed in.'); return viewAccount(); }
  const btn=document.getElementById('aGo'); btn.disabled=true;
  try{
    if(authTab==='up'){
      const username=document.getElementById('aUser').value.trim();
      if(!/^[A-Za-z0-9_]{3,20}$/.test(username)) return toast('Usernames are 3 to 20 letters, numbers, or underscores.');
      if(!id.includes('@')) return toast('Please enter a valid email address.');
      const { data:free } = await S.sb.rpc('username_available',{p_username:username});
      if(free===false) return toast('That username is taken. Please try another.');
      const name=(document.getElementById('aName').value.trim()||username).slice(0,40);
      const { data, error } = await S.sb.auth.signUp({email:id,password:pass,options:{data:{display_name:name, username, marketing_opt_in: !!document.getElementById('aOpt')?.checked},emailRedirectTo:location.origin}});
      if(error) return toast(error.message);
      if(!data.session) return toast('Almost done. Check your email and tap the link. Then you will come back here.');
    } else {
      let email=id;
      if(!id.includes('@')){
        const { data, error } = await S.sb.rpc('login_email',{p_username:id,p_password:pass});
        if(error) return toast(error.message);
        if(!data) return toast('That username and password do not match.');
        email=data;
      }
      const { error } = await S.sb.auth.signInWithPassword({email,password:pass});
      if(error) return toast(error.message==='Invalid login credentials'?'That sign-in and password do not match.':error.message);
    }
  } finally { if(document.body.contains(btn)) btn.disabled=false; }
}
async function redeem(){
  const code=document.getElementById('code').value.trim().toUpperCase(); if(!code) return;
  if(S.preview){ S.demoVip=true; toast('Preview: you are a VIP.'); return viewAccount(); }
  const { data, error } = await S.sb.rpc('redeem_vip_code',{p_code:code});
  if(error) return toast(error.message);
  if(!data) return toast('That code does not work, or it was already used.');
  await loadProfile(); S.pages={}; toast('Welcome to VIP.'); viewAccount();
}

async function loadSaved(){

async function toggleSave(id){
  if(!signedIn()){ lockSheet({kind:'account', title:'Save guides', line:'Make a free account to save guides and find them fast.'}); return false; }
  const on = !S.saved.has(id);
  if(on) S.saved.add(id); else S.saved.delete(id);
  if(S.preview){ LOCAL.set('saved',[...S.saved]); return on; }
  const r = on ? await S.sb.from('saved_items').insert({user_id:S.user.id, volume_id:id})
               : await S.sb.from('saved_items').delete().eq('user_id',S.user.id).eq('volume_id',id);
  if(r.error){ toast('That did not save. Please try again.'); if(on) S.saved.delete(id); else S.saved.add(id); }
  return S.saved.has(id);
}

async function newLoungeActivity(since){
  if(S.preview) return [];
  const { data } = await S.sb.from('forum_posts').select('thread_id,created_at').gt('created_at', since.toISOString()).limit(200);
  const { data:t } = await S.sb.from('forum_threads').select('id,title,created_at').gt('created_at', since.toISOString()).limit(20);
  const count = {}; (data||[]).forEach(p=>count[p.thread_id]=(count[p.thread_id]||0)+1); (t||[]).forEach(x=>count[x.id]=(count[x.id]||0)+1);
  const ids = Object.keys(count).map(Number).sort((a,b)=>count[b]-count[a]).slice(0,3);
  if(!ids.length) return [];
  const { data:titles } = await S.sb.from('forum_threads').select('id,title').in('id', ids);
  return (titles||[]).map(x=>({id:x.id, title:x.title, n:count[x.id]})).sort((a,b)=>b.n-a.n);
}

  return await S.sb.from('ledger_entries').update(patch).eq('id',id);

function ledgerMath(entries){
  const es = entries.slice().sort((a,b)=>String(a.entry_date).localeCompare(String(b.entry_date)) || String(a.created_at).localeCompare(String(b.created_at)));
  let b=0, w=0, p=0, c=0; const after={};
  for(const e of es){ if(!e.voided){ if(e.kind==='work'){ b+=+e.hours; w+=+e.hours; } else { const x=+e.amount / +e.rate; b-=x; p+=x; c+=+e.amount; } } after[e.id||e.receipt_no]=b; }
  return { es, b, w, p, c, after };
}
const balText = (b, rate) => Math.abs(b)<0.005 ? 'Even, 0 hrs owed' : b>0 ? `${hrs(b)} hrs unpaid (${money(b*rate)})` : `${hrs(-b)} hrs prepaid credit (${money(-b*rate)})`;
const entryLine = e => e.kind==='work' ? `${hrs(e.hours)} hrs worked (${money(e.hours*e.rate)})` : `Cash ${money(e.amount)} = ${hrs(e.amount/e.rate)} hrs off`;
function receiptText(e, L, rate){ return `Receipt #${e.receipt_no} — ${fmtDay(e.entry_date)}.\n${entryLine(e)}${e.note?' — '+e.note:''}.\nBalance: ${balText(L.after[e.id||e.receipt_no], rate)}.\nReply 👍 to confirm.`; }
function statementText(l, L){
  return `Statement — ${l.name}\n${l.worker} works · ${l.payer} pays · ${money(l.rate)}/hr\n\n` +
    L.es.map(e=>`#${e.receipt_no} ${fmtDay(e.entry_date)}: ${entryLine(e)}${e.voided?' (VOID)':''}${e.confirmed_at?' ✓':''}`).join('\n') +
    `\n\nBalance: ${balText(L.b, l.rate)}`;
}

      let fin=null, rate=null;

      if(!o.querySelector('.breakbox')) { o.innerHTML = `<div class="breakbox"><div class="kicker" style="text-align:center;margin-top:60px">Break</div><div class="fotime" id="brT" style="text-align:center;margin-top:20px"></div>

const dayISO = d => { const x=new Date(d); return new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,10); };

function exerciseMin(st){ return Math.min(15, 5 + 2*routineWeek(st)); }

function cust(st){ const c = st.custom||{}; return { morning:c.morning||[], evening:c.evening||[], prep:c.prep||[] }; }
function morningList(st){
  const hid = new Set(st.hidden||[]), c = cust(st).morning, out = [];
  MORNING.forEach(s=>{ c.filter(x=>x.before===s.k).forEach(x=>out.push({...x, custom:true})); if(!hid.has(s.k)) out.push(s); });

}
const eveningList = st => {   // your own evening steps go before "Into bed, lights out"
  const keep = EVENING.filter(s=>!(st.hidden||[]).includes(s.k)), mine = cust(st).evening.map(x=>({...x, custom:true}));
  const i = keep.findIndex(s=>s.k==='e_bed'); return i<0 ? [...keep, ...mine] : [...keep.slice(0,i), ...mine, ...keep.slice(i)];
};
const prepList = st => [...PREP.filter(s=>!(st.hidden||[]).includes(s.k)), ...cust(st).prep.map(x=>({...x, custom:true}))];

function routinePlan(st, rough){
  const leave = (()=>{ const [h,m]=String(st.leave_time||'07:30').split(':').map(Number); return h*60+m; })();
  const ex = exerciseMin(st);
  const all = morningList(st);
  const steps = all.map(s=>({...s, min: s.k==='exercise' ? (rough?5:ex) : +s.min||0}))
    .filter(s=>!rough || (st.rough_steps||[]).includes(s.k));
  const total = steps.reduce((t,s)=>t+s.min,0);
  let t = leave - total; steps.forEach(s=>{ s.start=t; t+=s.min; });
  const fullTotal = all.reduce((t,s)=>t+(s.k==='exercise'?ex:(+s.min||0)),0);
  const fullWake = leave - fullTotal;
  const bed = fullWake - 390;                 // 6.5 hours of sleep
  const evl = eveningList(st), eveTotal = evl.reduce((t,s)=>t+(+s.min||0),0);
  const eveStart = bed - eveTotal;
  let e = eveStart; const eve = evl.map(s=>{ const r={...s, start:e}; e+=+s.min||0; return r; });
  return { leave, steps, total, wake: leave-total, fullWake, fullTotal, bed, eveStart, eve, eveTotal, ex };

function routineToday(){

function routineStreak(days){
  const done = new Set(days.filter(d=>d.morning_done).map(d=>d.day));
  let n=0, cur=todayISO(); if(!done.has(cur)) cur=addDays(cur,-1);
  while(done.has(cur)){ n++; cur=addDays(cur,-1); }
  let best=0, run=0; const sorted=[...done].sort();
  sorted.forEach((d,i)=>{ run = (i>0 && addDays(sorted[i-1],1)===d) ? run+1 : 1; best=Math.max(best,run); });
  return { now:n, best };
}

      <p class="note">Your plan for a phone sales business. Do this during your 30-minute Enterprise Hour.</p>
      <ul class="rlist plain">${planWeek.tasks.map(([k,name])=>{ const key = planWeek.daily ? `d_${k}_${todayISO()}` : `w${planWeek.w}_${k}`; const on=(st.plan_done||[]).includes(key);
        return `<li class="rrow ${on?'done':''}"><button class="rcheck" data-plan="${key}" aria-pressed="${on}" aria-label="${esc(name)}">${on?'✓':''}</button><span class="rbody"><b>${esc(name)}</b></span></li>`; }).join('')}</ul>
      ${planWeek.daily?'<p class="note">These two reset every day.</p>':''}
      <label for="rNotes">Notes for this week</label><textarea id="rNotes" maxlength="2000" placeholder="${planWeek.w===1?'Example: Niche: roofers in North Dakota. Offer: ...':planWeek.w===2?'Write your script and your objection answers here.':'Where your leads come from, and anything to remember.'}">${esc(notes[wkey]||'')}</textarea>
      <details class="more"><summary>See the whole plan</summary>${PLAN.map(p=>`<p style="margin-top:8px"><b>Week ${p.w}${p.daily?' and after':''}: ${esc(p.title)}.</b> ${p.tasks.map(t=>esc(t[1])).join('. ')}.</p>`).join('')}</details></section>
    <div class="eyebrow">Today’s scoreboard</div>
    <section class="card"><div class="scoregrid">${SCORE.map(([k,l])=>`<label class="score"><span>${l}</span>
      <span class="stepper"><button type="button" data-dec="${k}" aria-label="One less: ${l}">−</button><input type="number" inputmode="numeric" min="0" max="10000" data-sc="${k}" value="${+day[k]||0}" aria-label="${l}"><button type="button" data-inc="${k}" aria-label="One more: ${l}">+</button></span></label>`).join('')}</div>
      ${day.calls?`<p class="note" style="margin-top:10px">Today: ${day.convos||0} of ${day.calls} calls became conversations${day.convos?`, and ${day.booked||0} booked`:''}.</p>`:''}</section>
    <div class="eyebrow">This week</div>
    ${full ? `<section class="card"><div class="wtot">${SCORE.map(([k,l])=>`<div><b>${tot(k)}</b><span>${l}</span></div>`).join('')}</div></section>`
      : `<section class="card dash"><p><span class="vipmark" style="margin:0 6px 0 0">VIP</span>Weekly totals, your streak, and your full history are for VIPs.</p><div class="row"><button class="btn gold" onclick="lockSheet({kind:'vip', title:'Routine history'})">See what VIP opens</button></div></section>`}`;
  } else {
    if(!full){
      body = `<section class="card dash" style="text-align:center"><div class="locked">${padlock()}<h2>Your history</h2><p>VIPs see their streak, every day they finished, and their business numbers week by week.</p>
        <button class="btn gold" onclick="lockSheet({kind:'vip', title:'Routine history'})">See what VIP opens</button></div></section>`;
    } else {
      const weeks = {}; RT.days.forEach(d=>{ const w=weekStart(d.day); weeks[w] ||= {leads:0,calls:0,convos:0,booked:0,closed:0,mornings:0}; SCORE.forEach(([k])=>weeks[w][k]+=+d[k]||0); if(d.morning_done) weeks[w].mornings++; });
      const last30 = [...Array(30)].map((_,i)=>addDays(todayISO(),-i));
      body = `<section class="card paper rsum"><div class="rbig"><span>Streak <b>${sk.now} ${sk.now===1?'day':'days'}</b></span><span>Best <b>${sk.best}</b></span></div>
        <p class="meta">A day counts when you finish your morning checklist (the short version counts too).</p></section>
      <div class="eyebrow">Last 30 days</div>
      <div class="card"><div class="heat" role="img" aria-label="Mornings finished in the last 30 days: ${last30.filter(d=>RT.days.find(x=>x.day===d&&x.morning_done)).length}">${last30.slice().reverse().map(d=>{ const x=RT.days.find(y=>y.day===d); return `<span class="${x?.morning_done?(x.rough?'half':'on'):''}" title="${fmtDay(d)}"></span>`; }).join('')}</div>
        <p class="note" style="margin-top:8px">Gold = full morning. Light gold = rough morning.</p></div>
      <div class="eyebrow">Week by week</div>
      <div class="card" style="overflow-x:auto"><table class="wtable"><thead><tr><th scope="col">Week of</th><th scope="col">Mornings</th>${SCORE.map(([,l])=>`<th scope="col">${l}</th>`).join('')}</tr></thead>
        <tbody>${Object.keys(weeks).sort().reverse().slice(0,8).map(w=>`<tr><th scope="row">${new Date(w+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</th><td>${weeks[w].mornings}</td>${SCORE.map(([k])=>`<td>${weeks[w][k]}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="7">Nothing yet.</td></tr>`}</tbody></table></div>`;
    }
  }
  const roughTotal = morningList(st).filter(s=>(st.rough_steps||[]).includes(s.k)).reduce((t,s)=>t+(s.k==='exercise'?5:(+s.min||0)),0);
  $app.innerHTML = header()+backBar('#/tools','Tools')+`<div class="hero"><h1>Formidable Routine</h1><p>Win the morning. Close the day. Grow your business a little every day.${full&&sk.now?` <strong style="color:var(--gold-hi)">${sk.now} day streak.</strong>`:''}</p></div>
  <div class="rtabs" role="tablist" aria-label="Routine">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${RT.tab===k}" data-rtab="${k}">${l}${k==='history'&&!full?' <span class="vipmark" style="margin-left:4px">VIP</span>':''}</button>`).join('')}</div>
  <div id="rBody">${body}</div>
  <details class="more card"><summary>Settings</summary>
    <label for="rLeave">What time do you leave in the morning?</label><input id="rLeave" type="time" value="${esc(String(st.leave_time).slice(0,5))}">
    <p class="note" style="margin-top:6px">All your start times count back from this. Your full morning is ${hm(P.fullTotal)} right now, so you wake at ${t12(P.fullWake)}.</p>
    <label for="rStart">Week 1 of your plan started on</label><input id="rStart" type="date" value="${esc(st.started_on)}" max="${todayISO()}">
    <p class="note" style="margin-top:6px">Exercise starts at 5 min and grows 2 min each week, up to 15. Your wake time moves earlier to match.</p>
    <fieldset class="roughpick"><legend>Rough morning steps (up to ${ROUGH_MAX} min)</legend>
      ${morningList(st).map(s=>{ const m=s.k==='exercise'?5:(+s.min||0); return `<label class="optin"><input type="checkbox" data-rough="${s.k}" ${(st.rough_steps||[]).includes(s.k)?'checked':''}> ${esc(s.name)} · ${m} min</label>`; }).join('')}
      <p class="note" id="rRoughTot" style="margin-top:8px">Picked: ${roughTotal} of ${ROUGH_MAX} min.</p></fieldset>
    <div class="row"><button class="btn" id="rSave">Save settings</button></div></details>${footer()}`;

  $app.querySelectorAll('[data-rtab]').forEach(b=>b.onclick=()=>{ RT.tab=b.dataset.rtab; RT.edit=null; drawRoutine(); document.querySelector(`[data-rtab="${RT.tab}"]`)?.focus(); });
  $app.querySelectorAll('[data-ck]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.ck; day.checks = has(k) ? day.checks.filter(x=>x!==k) : [...day.checks, k];
    const P2 = routinePlan(st, day.rough);
    day.morning_done = P2.steps.length>0 && P2.steps.every(s=>day.checks.includes(s.k));
    const evl = eveningList(st); day.evening_done = evl.length>0 && evl.every(s=>day.checks.includes(s.k));
    routineSaveDay(day); drawRoutine(); document.querySelector(`[data-ck="${k}"]`)?.focus();
  });
  const rr=document.getElementById('rRough'); if(rr) rr.onclick=()=>{ day.rough=!day.rough; const P2=routinePlan(st, day.rough); day.morning_done=P2.steps.length>0&&P2.steps.every(s=>day.checks.includes(s.k)); routineSaveDay(day); drawRoutine(); document.getElementById('rRough')?.focus(); };
  $app.querySelectorAll('[data-plan]').forEach(b=>b.onclick=async()=>{
    const k=b.dataset.plan; const cur=st.plan_done||[]; st.plan_done = cur.includes(k) ? cur.filter(x=>x!==k) : [...cur.filter(x=>!x.startsWith('d_')||x.endsWith(todayISO())), k];
    drawRoutine(); document.querySelector(`[data-plan="${k}"]`)?.focus(); const r=await routineSaveSettings({plan_done:st.plan_done}); if(r.error) toast(r.error.message);
  });
  const nt=document.getElementById('rNotes'); if(nt){ let t; nt.oninput=()=>{ clearTimeout(t); t=setTimeout(async()=>{ st.plan_notes={...(st.plan_notes||{}), ['w'+planWeek.w]:nt.value}; const r=await routineSaveSettings({plan_notes:st.plan_notes}); if(r.error) toast(r.error.message); },600); }; }
  const setScore=(k,v)=>{ day[k]=Math.max(0,Math.min(10000,v|0)); routineSaveDay(day); const inp=document.querySelector(`[data-sc="${k}"]`); if(inp) inp.value=day[k]; };
  $app.querySelectorAll('[data-sc]').forEach(i=>i.oninput=()=>setScore(i.dataset.sc, +i.value));
  $app.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>setScore(b.dataset.inc, (+day[b.dataset.inc]||0)+1));
  $app.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>setScore(b.dataset.dec, (+day[b.dataset.dec]||0)-1));
  const saveLists = async (msg)=>{ const r=await routineSaveSettings({custom:st.custom, hidden:st.hidden}); if(r.error) return toast(r.error.message); if(msg) toast(msg); };
  $app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{ RT.edit=b.dataset.edit; drawRoutine(); document.getElementById('aName')?.focus(); });
  const ad=document.getElementById('aDone'); if(ad) ad.onclick=()=>{ const w=RT.edit; RT.edit=null; drawRoutine(); document.querySelector(`[data-edit="${w}"]`)?.focus(); };
  $app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{
    const k=b.dataset.rm, w=RT.edit; st.custom = cust(st);
    if(k.startsWith('c_')) st.custom[w] = st.custom[w].filter(x=>x.k!==k); else st.hidden = [...new Set([...(st.hidden||[]), k])];
    st.rough_steps = (st.rough_steps||[]).filter(x=>x!==k);
    drawRoutine(); await saveLists('Step removed.'); await routineSaveSettings({rough_steps:st.rough_steps});
    (document.querySelector('[data-rm]')||document.getElementById('aName'))?.focus();
  });
  const aa=document.getElementById('aAdd'); if(aa) aa.onclick=async()=>{
    const w=aa.dataset.list, name=document.getElementById('aName').value.trim();
    if(!name) return toast('Type a name for your step.');
    const min = w==='prep' ? 0 : Math.max(1, Math.min(120, +document.getElementById('aMin').value||5));
    if(cust(st)[w].length >= 15) return toast('You can add up to 15 of your own steps here.');
    st.custom = cust(st);
    const item = { k:'c_'+uid4().toLowerCase(), name:name.slice(0,60), min };
    if(w==='morning'){ const bf=document.getElementById('aBefore').value; if(bf) item.before=bf; }
    st.custom[w] = [...st.custom[w], item];
    drawRoutine(); await saveLists(`Added "${item.name}".`); document.getElementById('aName')?.focus();
  };
  const ar=document.getElementById('aRestore'); if(ar) ar.onclick=async()=>{ const w=ar.dataset.list; st.hidden=(st.hidden||[]).filter(k=>!DEFAULTS[w].some(s=>s.k===k)); drawRoutine(); await saveLists('Our steps are back.'); };
  const upTot=()=>{ const picked=[...document.querySelectorAll('[data-rough]:checked')].map(i=>i.dataset.rough); const t=morningList(st).filter(s=>picked.includes(s.k)).reduce((a,s)=>a+(s.k==='exercise'?5:(+s.min||0)),0); document.getElementById('rRoughTot').textContent=`Picked: ${t} of ${ROUGH_MAX} min.${t>ROUGH_MAX?' That is too long. Uncheck a step.':''}`; return {picked,t}; };
  $app.querySelectorAll('[data-rough]').forEach(i=>i.onchange=upTot);
  document.getElementById('rSave').onclick=async()=>{
    const {picked,t}=upTot(); if(t>ROUGH_MAX) return toast(`Your rough morning is ${t} min. Keep it to ${ROUGH_MAX} or less.`);
    if(!picked.length) return toast('Pick at least one step for rough mornings.');
    const patch={ leave_time:document.getElementById('rLeave').value||'07:30', started_on:document.getElementById('rStart').value||st.started_on, rough_steps:picked };
    const r=await routineSaveSettings(patch); if(r.error) return toast(r.error.message);
    Object.assign(st, patch); toast('Settings saved. Your times are updated.'); drawRoutine();
  };
}


/* ============ DOWNLOAD APP BUTTON (hides once the app is installed) ============ */
let installEvt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isMacSafari = () => /Macintosh/.test(navigator.userAgent) && /Safari/.test(navigator.userAgent) && !/Chrome|Chromium|Edg|Firefox/.test(navigator.userAgent) && navigator.maxTouchPoints < 2;
function hideInstall(){ document.getElementById('getapp')?.remove(); document.documentElement.classList.remove('hasget'); }
function showInstall(){
  if(isStandalone()){ store('mobvault.installed', true); return hideInstall(); }
  if(store('mobvault.installed') && !installEvt) return hideInstall();
  if(!(installEvt || isIOS() || isMacSafari())) return hideInstall();   // this browser can't install apps
  if(document.getElementById('getapp')) return;
  const b = document.createElement('button'); b.id = 'getapp'; b.type = 'button';
  b.innerHTML = `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Download the App`;
  b.onclick = installApp; document.body.appendChild(b); document.documentElement.classList.add('hasget');
}
async function installApp(){
  if(installEvt){
    installEvt.prompt(); const { outcome } = await installEvt.userChoice; installEvt = null;
    if(outcome === 'accepted'){ store('mobvault.installed', true); hideInstall(); } return;
  }
  closeSheet();
  const steps = isIOS()
    ? `<ol class="steps"><li>Tap the <strong>Share</strong> button <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px" aria-label="Share icon"><path d="M12 15V3M8 7l4-4 4 4M5 11v9h14v-9"/></svg> at the bottom (or top) of your browser.</li><li>Scroll down and tap <strong>Add to Home Screen</strong>.</li><li>Tap <strong>Add</strong>. The MOB Vault is now on your home screen.</li></ol>`
    : `<ol class="steps"><li>In Safari, open the <strong>File</strong> menu at the top of your screen.</li><li>Click <strong>Add to Dock</strong>.</li><li>Click <strong>Add</strong>. The MOB Vault is now in your Dock.</li></ol>`;
  const w = document.createElement('div'); w.className='sheetwrap'; w.id='sheet';
  w.innerHTML = `<div class="sheetbg" data-close></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="gaT"><div class="sheethandle" aria-hidden="true"></div>
    <h2 id="gaT">Get the app</h2><p>It takes 3 taps. It is free, and it opens like any other app.</p>${steps}
    <button class="btn gold wide" data-close>Got it</button></section>`;
  document.body.appendChild(w);
  w.querySelectorAll('[data-close]').forEach(x=>x.onclick=closeSheet);
  w.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });
  w.querySelector('button').focus();
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; store('mobvault.installed', null); showInstall(); });
window.addEventListener('appinstalled', () => { installEvt = null; store('mobvault.installed', true); hideInstall(); toast('The MOB Vault is on your home screen.'); });
matchMedia('(display-mode: standalone)').addEventListener?.('change', showInstall);

/* ============ ROUTER ============ */
async function route(){
  window.scrollTo(0,0); closeSheet();
  const parts=(location.hash||'#/home').slice(2).split('/');
  if(store('mobvault.focus.run') && !document.getElementById('fo')) showFocusOverlay();
  try{
    if(parts[0]==='home' || parts[0]==='') return await viewHome();
    if(parts[0]==='shelf') return await viewShelf();
    if(parts[0]==='tools'){ if(parts[1]==='ledger') return parts[2] ? await viewLedger(parts[2]) : await viewLedgerHome(); if(parts[1]==='focus') return await viewFocus(); if(parts[1]==='routine') return await viewRoutine(); return viewTools(); }
    if(parts[0]==='share') return await viewShare(parts[1]||'');
    if(parts[0]==='read') return await viewReader(decodeURIComponent(parts[1]), +parts[2]||0);
    if(parts[0]==='item') return await viewItem(decodeURIComponent(parts[1]));
    if(parts[0]==='guild') return parts[1] ? await viewThread(parts[1]) : await viewGuild();
    if(parts[0]==='u') return await viewProfile(decodeURIComponent(parts[1]||''));
    if(parts[0]==='admin') return parts[1]==='members' ? await viewMembers() : await viewAdmin();
    if(parts[0]==='guide') return viewCryptoGuide();
    if(parts[0]==='legal') return viewLegal(parts[1]);
    if(parts[0]==='journal') return viewJournal();
    if(parts[0]==='account' || parts[0]==='me') return viewAccount();
    return await viewHome();
  }catch(e){ console.error(e); $app.innerHTML=header()+'<div class="empty">Something went wrong. Please refresh.</div>'; }
}

/* ============ START ============ */
(async function init(){
  if(store('mobvault.bigtext')) document.documentElement.classList.add('big');
  new MutationObserver(()=>{
    if(!$app.querySelector('.foot')) $app.insertAdjacentHTML('beforeend', `<footer class="foot">${copyright()}</footer>`);
  }).observe($app,{childList:true});
  S.preview = CONFIG.SUPABASE_URL.includes('YOUR-') || !window.supabase;
  if(!S.preview){
    S.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    const { data } = await S.sb.auth.getSession(); S.user = data.session?.user || null;
    await loadProfile();
    S.sb.auth.onAuthStateChange(async (_e, session)=>{
      const was=S.user?.id; S.user=session?.user||null;
      if(was!==S.user?.id){ await loadProfile(); S.pages={}; await route(); afterAuth(); }
    });
  } else { await loadProfile(); }
  window.addEventListener('hashchange', route);
  showInstall();
  await route();
  afterAuth();   // someone who tapped "Join VIP" and then confirmed their email goes on to checkout
  if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
