/* ============ HELPERS ============ */
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when = iso => { try { return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'}); } catch(e){ return ''; } };
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }
function store(key,val){ try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||'null'); localStorage.setItem(key,JSON.stringify(val)); }catch(e){ return null; } }
function payButton(uid, label){ return uid ? `<span class="paybtn"><blockonomics-pay-button uid="${esc(uid)}" label="${esc(label)}"></blockonomics-pay-button></span>` : '<p><em>Payments open soon.</em></p>'; }
function vipPanel(){ return `<div class="panel" style="border-color:var(--vip)"><h2 style="color:var(--vip)">Become VIP · ${esc(CONFIG.VIP_PRICE_LABEL)}</h2>
   <p>Unlock every sealed page in every volume, the private Shadow Journal, and the Guild Hall members' forum. Each payment unlocks <strong>30 days</strong>.</p>
   ${payButton(CONFIG.PAY.membership,'Join with Crypto')}
   <p style="margin-top:12px;font-size:16px">Your VIP key is sent to the email you enter at checkout. Enter it on the Account tab after you sign in.</p></div>`; }
function applyTheme(){ const t=THEMES[CONFIG.THEME]||THEMES.gilded; const r=document.documentElement.style; Object.entries(t).forEach(([k,v])=>r.setProperty('--'+k,v)); document.querySelector('meta[name=theme-color]').content=t.bg; }
const signedIn = () => S.preview ? S.demoUser : !!S.user;
const vip = () => S.preview ? S.demoVip : S.isVip;
const displayName = () => S.preview ? 'Preview Member' : (S.profile?.display_name || S.user?.email || '');

/* ============ DATA ============ */
async function loadProfile(){
  if(S.preview || !S.user){ S.profile=null; S.isVip=false; S.vipUntil=null; return; }
  const { data } = await S.sb.from('profiles').select('display_name,is_vip,vip_source,vip_until').eq('id',S.user.id).maybeSingle();
  S.profile = data;
  S.vipUntil = data?.vip_until ? new Date(data.vip_until) : null;
  S.isVip = !!data?.is_vip || (!!S.vipUntil && S.vipUntil > new Date());
}
async function loadVolumes(){
  if(S.preview){ S.volumes=PREVIEW.volumes; return; }
  const { data, error } = await S.sb.from('volumes').select('*').order('sort');
  if(error) toast('Could not load the shelf.');
  S.volumes = data || [];
}
async function loadPages(volId, force){
  if(S.pages[volId] && !force) return S.pages[volId];
  if(S.preview){ S.pages[volId]=PREVIEW.pages.filter(p=>p.volume_id===volId); return S.pages[volId]; }
  const { data, error } = await S.sb.from('pages').select('id,volume_id,sort,numeral,title,tier,teaser,page_bodies(body)').eq('volume_id',volId).order('sort');
  if(error) toast('Could not open this volume.');
  S.pages[volId] = (data||[]).map(p=>({...p, body: Array.isArray(p.page_bodies) ? p.page_bodies[0]?.body : p.page_bodies?.body }));
  return S.pages[volId];
}

async function viewReader(volId, idx){
  renderNav('shelf');
  const pages = await loadPages(volId);
  if(!S.volumes.length) await loadVolumes();
  const vol = S.volumes.find(v=>v.id===volId);
  if(!pages.length){ $app.innerHTML=header()+'<div class="empty">This volume has no pages yet.</div>'; return; }
  idx = Math.max(0, Math.min(pages.length-1, idx|0));
  const p = pages[idx];
  const sealed = p.tier==='vip' && (!vip() || !p.body);
  let inner;
  if(p.tier==='vip' && vip() && S.preview){
    inner = `<div class="locked"><div class="coin">${EMBLEM}</div><p>${esc(p.teaser||'')}</p><p>Preview: once your database is connected, VIP members read this page here.</p></div>`;
  } else if(sealed){
    inner = `<div class="locked"><div class="coin">${EMBLEM}</div><p>${esc(p.teaser||'This page is sealed.')}</p>
      <a class="btn vip solid" href="#/account">${signedIn()?'Unlock with VIP':'Sign in to unlock'}</a></div>`;
  } else inner = `<div class="body">${p.body||''}</div>`;
  $app.innerHTML = header()+`
  <div class="reader-head"><button class="back" onclick="location.hash='#/shelf'">‹ SHELF</button><span class="counter">${esc(vol?.title||'')} · ${idx+1}/${pages.length}</span></div>
  <article class="tarot" id="card"><div class="tarot-frame">
    ${['tl','tr','bl','br'].map(c=>CORNER.replace('CLS',c)).join('')}
    <div class="numeral">${esc(p.numeral)}</div><h2 class="page-title">${esc(p.title)}</h2>
    <div class="rule">✦</div>${inner}
  </div></article>
  <div class="pager"><button class="btn round" id="prev" ${idx===0?'disabled':''} aria-label="Previous page">‹</button>
   <div class="dots">${pages.map((q,i)=>`<span class="dot ${i===idx?'on':''} ${q.tier==='vip'?'v':''}"></span>`).join('')}</div>
   <button class="btn round" id="next" ${idx===pages.length-1?'disabled':''} aria-label="Next page">›</button></div>`;
  const go = d => { const n=idx+d; if(n>=0&&n<pages.length) location.hash=`#/read/${volId}/${n}`; };
  document.getElementById('prev').onclick=()=>go(-1);
  document.getElementById('next').onclick=()=>go(1);
  const card=document.getElementById('card'); let sx=null;
  card.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
  card.addEventListener('touchend',e=>{ if(sx===null)return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50) go(dx<0?1:-1); sx=null; });
  document.onkeydown = e => { if(!location.hash.startsWith('#/read'))return; if(e.key==='ArrowRight')go(1); if(e.key==='ArrowLeft')go(-1); };
}

    <div class="row"><button class="btn solid" id="tPost">Post</button><button class="btn" id="tCancel">Cancel</button></div></div>
  ${threads.length?threads.map(t=>{const n=S.preview?(t.posts||[]).length:(t.forum_posts?.[0]?.count||0);return `<button class="thread" data-t="${t.id}"><h3>${esc(t.title)}</h3>
   <div class="meta">${esc(t.author?.display_name||'Member')} · ${esc(catName(t.category_id))} · ${when(t.created_at)} · ${n} ${n===1?'reply':'replies'}</div></button>`}).join(''):'<div class="empty">No discussions yet. Light the first lantern.</div>'}`;

    const title=document.getElementById('tTitle').value.trim(), body=document.getElementById('tBody').value.trim(), cat=+document.getElementById('tCat').value;
    if(!title||!body) return toast('Add a title and a message.');

    if(error) return toast('Could not post: '+error.message);
    toast('Posted to the Guild Hall.'); viewGuild();
  };

async function viewThread(id){

  else {

    const r2 = await S.sb.from('forum_posts').select('id,body,created_at,author:profiles(display_name)').eq('thread_id',id).order('created_at'); posts=r2.data||[];
  }
  if(!t){ $app.innerHTML=header()+'<div class="empty">Discussion not found.</div>'; return; }
  $app.innerHTML=header()+`<div class="reader-head"><button class="back" onclick="location.hash='#/guild'">‹ GUILD HALL</button></div>

  <div class="panel"><label>Your reply</label><textarea id="rBody" maxlength="5000"></textarea><div class="row"><button class="btn solid" id="rPost">Reply</button></div></div>`;
  document.getElementById('rPost').onclick=async()=>{
    const body=document.getElementById('rBody').value.trim(); if(!body) return;
    if(S.preview) return toast('Preview mode: replies turn on once Supabase is connected.');

   <div class="row"><button class="btn vip" id="redeem">Unlock VIP</button></div></div>`}
  ${S.preview?`<div class="panel"><h2>Preview Controls</h2><p>Flip VIP on and off to see both experiences.</p><div class="row"><button class="btn vip" id="demoVip">${S.demoVip?'Turn VIP off':'Preview as VIP'}</button></div></div>`:''}
  <div class="row"><button class="btn" id="out">Sign Out</button></div>`;
  const r=document.getElementById('redeem'); if(r) r.onclick=redeem;
  const dv=document.getElementById('demoVip'); if(dv) dv.onclick=()=>{S.demoVip=!S.demoVip;viewAccount();};
  document.getElementById('out').onclick=async()=>{ if(S.preview){S.demoUser=false;S.demoVip=false;} else await S.sb.auth.signOut(); location.hash='#/shelf'; };
}
async function doAuth(){
  const email=document.getElementById('aEmail').value.trim(), pass=document.getElementById('aPass').value;
  if(!email||pass.length<8) return toast('Enter your email and a password of 8+ characters.');
  if(S.preview){ S.demoUser=true; toast('Preview: signed in.'); return viewAccount(); }
  if(authTab==='up'){
    const name=(document.getElementById('aName').value.trim()||email.split('@')[0]).slice(0,40);
    const { data, error } = await S.sb.auth.signUp({email,password:pass,options:{data:{display_name:name},emailRedirectTo:location.origin}});
    if(error) return toast(error.message);
    if(!data.session) return toast('Check your email to confirm your account.');
  } else {
    const { error } = await S.sb.auth.signInWithPassword({email,password:pass});
    if(error) return toast(error.message);
  }
}
async function redeem(){
  const code=document.getElementById('code').value.trim().toUpperCase(); if(!code) return;
  if(S.preview){ S.demoVip=true; toast('Preview: VIP unlocked.'); return viewAccount(); }
  const { data, error } = await S.sb.rpc('redeem_vip_code',{p_code:code});
  if(error) return toast(error.message);
  if(!data) return toast('That key is invalid or already used.');
  await loadProfile(); S.pages={}; toast('Welcome to the Inner Circle.'); viewAccount();
}

/* ============ ROUTER ============ */
async function route(){
  const parts=(location.hash||'#/shelf').slice(2).split('/');
  try{
    if(parts[0]==='read') return await viewReader(decodeURIComponent(parts[1]), +parts[2]||0);
    if(parts[0]==='guild') return parts[1] ? await viewThread(parts[1]) : await viewGuild();
    if(parts[0]==='journal') return viewJournal();
    if(parts[0]==='account') return viewAccount();
    return await viewShelf();
  }catch(e){ console.error(e); $app.innerHTML=header()+'<div class="empty">Something went wrong. Pull down to refresh.</div>'; }
}

/* ============ BOOT ============ */
(async function init(){
  applyTheme();
  S.preview = CONFIG.SUPABASE_URL.includes('YOUR-') || !window.supabase;
  if(!S.preview){
    S.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    const { data } = await S.sb.auth.getSession(); S.user = data.session?.user || null;
    await loadProfile();
    S.sb.auth.onAuthStateChange(async (_e, session)=>{
      const was=S.user?.id; S.user=session?.user||null;
      if(was!==S.user?.id){ await loadProfile(); S.pages={}; route(); }
    });
  }
  window.addEventListener('hashchange', route);
  route();
  if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
