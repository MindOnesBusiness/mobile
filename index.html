<style>
:root{
  --desk:#0E1C19; --bar:#0B1714; --green:#152C28; --panel:#17302B; --ivory:#F3EFE5; --gold:#B79B62; --gold-hi:#E3CE96; --gold-ink:#74602F; --char:#202423;
  --text:#ECE6D8; --muted:#A3ADA6; --line:rgba(183,155,98,.30); --danger:#E7A193;
  --foil:linear-gradient(115deg,#7d6330 0%,#c9ad6e 18%,#f6e7b8 32%,#b79b62 48%,#8c7038 62%,#ead59e 80%,#a5884d 100%);
  --serif:'Marcellus','Cinzel',Georgia,'Times New Roman',serif; --caps:'Cinzel','Marcellus',Georgia,serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --nav:70px; --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
html{background:var(--desk)}
body{background:radial-gradient(ellipse 130% 55% at 50% 0%,#1d3a33 0%,var(--desk) 62%) fixed,var(--desk);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.2;color:var(--text)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--gold-hi);font-weight:600;text-underline-offset:3px}
.app{max-width:640px;margin:0 auto;min-height:100%;padding:0 16px calc(var(--nav) + env(safe-area-inset-bottom) + 24px)}

/* gold foil */
.foil,.hero h1,.vipcard h2,.stats b,.rite,.brand b{background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.foilbg{background:var(--foil)}

/* header */
.top{position:relative;background:var(--bar);margin:0 -16px 18px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--foil)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:42px;height:42px;display:block}
.brand b{display:block;font-family:var(--caps);font-weight:600;font-size:19px;letter-spacing:.14em;line-height:1.1}
.brand small{display:block;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.badge{font-family:var(--caps);font-weight:700;font-size:11px;letter-spacing:.14em;padding:6px 12px;border-radius:999px;border:1px solid var(--gold);color:var(--gold-hi);white-space:nowrap}
.badge.vip,.badge.admin{background:var(--foil);color:var(--char);border-color:transparent;box-shadow:0 0 14px rgba(227,206,150,.25)}
.preview-bar{font-size:13px;font-weight:600;text-align:center;padding:8px;border:1px dashed var(--danger);border-radius:10px;color:var(--danger);margin-bottom:14px}

/* type */
.hero{margin:4px 0 18px}
.hero h1{font-size:32px;display:inline-block}
.hero p{color:var(--muted);margin-top:4px}
.eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--caps);font-weight:600;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-hi);margin:24px 0 12px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--foil);opacity:.8}
.note{font-size:15px;color:var(--muted)}
.banner{display:block;width:100%;border-radius:var(--r);background:#050d0b;margin-bottom:14px;border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.45)}

/* cards (dark leather) */
.card{background:linear-gradient(180deg,#19342F,#132925);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.card h2{font-size:23px;margin-bottom:8px}
.card p{margin-bottom:10px}.card p:last-child{margin-bottom:0}
.card.dark{background:#0F211D}
.card.vipcard{border:1px solid transparent;background:linear-gradient(180deg,#19342F,#10241F) padding-box,var(--foil) border-box;box-shadow:0 12px 34px rgba(0,0,0,.45),0 0 28px rgba(227,206,150,.08)}
.card.dash{border-style:dashed;box-shadow:none;background:transparent}
/* paper (ivory) — reading and writing surfaces */
.paper,.card.paper,.card.legal,.page-card{background:var(--ivory);color:var(--char);border:1px solid #d9cfb8;box-shadow:0 14px 34px rgba(0,0,0,.5),0 2px 0 rgba(0,0,0,.25)}
.paper h1,.paper h2,.paper h3,.card.legal h2,.page-card h2{color:var(--green)}
.paper a,.card.legal a,.page-card a{color:var(--green)}
.paper .note,.paper .meta,.card.legal .note{color:#5E615C}
.paper label{color:var(--char)}
.paper .who{color:var(--char)} .paper .who .un{color:#5E615C}

.ticks{list-style:none;margin:8px 0 12px}
.ticks li{padding-left:26px;position:relative;margin:6px 0}
.ticks li::before{content:"";position:absolute;left:2px;top:9px;width:12px;height:7px;border-left:2px solid var(--gold-hi);border-bottom:2px solid var(--gold-hi);transform:rotate(-45deg)}
.steps{list-style:none;counter-reset:s;margin:6px 0}
.steps li{counter-increment:s;padding-left:44px;position:relative;margin:12px 0}
.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);color:var(--gold-hi);font-family:var(--caps);font-weight:700;display:flex;align-items:center;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:10px;border:0;background:var(--foil);background-size:140% 100%;color:var(--char);
  font-family:var(--sans);font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;min-height:48px;transition:background-position .4s,filter .15s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.25),0 4px 14px rgba(0,0,0,.3)}
.btn:hover{background-position:100% 0;filter:brightness(1.06)}
a.btn,.card a.btn{color:var(--char)}
.btn.outline{background:transparent;color:var(--gold-hi);border:1px solid var(--gold);box-shadow:none}
.card a.btn.outline{color:var(--gold-hi)}
.paper .btn.outline,.paper a.btn.outline{color:var(--green);border-color:var(--green)}
.btn.gold{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 22px rgba(227,206,150,.22),0 4px 14px rgba(0,0,0,.35)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);box-shadow:none}
.paper .btn.danger{color:#9B2C2C;border-color:#9B2C2C}
.btn.small{min-height:38px;padding:6px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px;color:var(--text)}
input,textarea,select{width:100%;background:#0D1E1A;border:1px solid rgba(183,155,98,.38);border-radius:10px;padding:11px 13px;font-size:16px;color:var(--text)}
input::placeholder,textarea::placeholder{color:#7f8a84}
select option{background:#0D1E1A;color:var(--text)}
.paper input,.paper textarea,.paper select{background:#fff;color:var(--char);border-color:#cfc6b3}
.paper input::placeholder,.paper textarea::placeholder{color:#8a8a84}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold-hi);box-shadow:0 0 0 3px rgba(183,155,98,.25)}
input[type=file]{padding:8px}
textarea{min-height:110px;resize:vertical}
.count{font-size:13px;color:var(--muted);text-align:right;margin-top:4px}
.tabs{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:6px}
.tabs button{flex:1;background:transparent;border:0;padding:10px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--foil);color:var(--char)}
.optin{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:15px;margin:14px 0 0;cursor:pointer}
.optin input{width:20px;height:20px;flex:none;margin-top:3px;accent-color:var(--gold)}
details.more{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
details.more summary{font-weight:600;cursor:pointer;color:var(--gold-hi)}
.paybtn{display:block;margin-top:10px}
.pp-sub{margin-top:12px;max-width:420px;background:var(--ivory);border-radius:10px;padding:8px}
blockonomics-pay-button:not(:defined)::before{content:"Loading the pay button…";font-style:italic;opacity:.75}

/* shelf rows */
.shelfrow{margin:0 -16px 8px;position:relative}
.shelfrow .eyebrow{margin:22px 16px 10px}
.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 16px;scroll-padding-left:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.poster{flex:none;width:156px;scroll-snap-align:start;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--text)}
.cover{position:relative;width:156px;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--green);box-shadow:0 10px 24px rgba(0,0,0,.5);transition:transform .2s,box-shadow .2s}
.poster:hover .cover,.poster:focus-visible .cover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.55),0 0 20px rgba(227,206,150,.15)}
.cover img.full{width:100%;height:100%;object-fit:cover;display:block}
.cover .ov{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 12px;background:linear-gradient(transparent,rgba(8,18,16,.92));color:var(--ivory);font-size:12.5px;line-height:1.35}
.cover.gen{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px 13px 14px;text-align:center;
  background:radial-gradient(circle at 50% 30%,#24453e,var(--green) 65%,#0f201c)}
.cover.gen::before{content:"";position:absolute;inset:0;border-radius:10px;padding:1px;background:var(--foil);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.cover.gen::after{content:"";position:absolute;inset:6px;border:1px solid rgba(183,155,98,.55);border-radius:6px;pointer-events:none}
.cover.gen .em{width:38px;height:38px}
.cover.gen .mid{display:flex;flex-direction:column;align-items:center;gap:8px}
.cover.gen .ct{font-family:var(--serif);font-size:19px;line-height:1.15;background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.cover.gen .cs{font-size:11.5px;line-height:1.35;color:#d7d2c4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cover.gen .ck{font-family:var(--caps);font-size:10px;letter-spacing:.18em;color:var(--gold-hi);text-transform:uppercase}
.cover .lock{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:var(--foil);color:var(--char);display:flex;align-items:center;justify-content:center;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.cover .lock svg{width:15px;height:15px}
.poster .pt{font-weight:600;font-size:14px;line-height:1.3;margin-top:9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.poster .pl{font-size:12px;color:var(--muted);margin-top:2px}
.arrow{position:absolute;top:84px;width:36px;height:36px;border-radius:50%;border:1px solid var(--gold);background:rgba(11,23,20,.88);color:var(--gold-hi);
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;font-size:20px;line-height:1}
.arrow.l{left:6px}.arrow.r{right:6px}
@media (hover:none){.arrow{display:none}}
.soon{flex:none;width:156px;aspect-ratio:2/3;border:1px dashed var(--gold);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;color:var(--muted);font-size:14px}

/* reader */
.reader-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.back{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer;color:var(--text)}
.counter{font-family:var(--caps);font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.reader-title{font-size:28px;margin-bottom:4px}
.pill{display:inline-block;white-space:nowrap;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--gold);color:var(--gold-hi)}
.pdfbox{overflow-x:auto;margin:12px 0}
.pdfpage{margin:0 0 18px;text-align:center}
.pdfpage canvas{display:block;margin:0 auto;border-radius:4px;background:#fff;box-shadow:0 16px 36px rgba(0,0,0,.55)}
.pdfpage figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.zoom{display:flex;gap:8px;flex-wrap:wrap}
.media.audio{width:100%;margin:8px 0}
video.media{width:100%;border-radius:var(--r);background:#000}
.vidwrap{position:relative;padding-top:56.25%;border-radius:var(--r);overflow:hidden}
.vidwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.page-card{border-radius:var(--r);padding:22px;min-height:50vh}
.page-card .body p{margin-bottom:12px}.page-card .body ul,.page-card .body ol{margin:0 0 12px 22px}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:12px}
.locked{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:8px 0}
.padlock{width:56px;height:56px;border-radius:50%;border:1px solid var(--gold);color:var(--gold-hi);display:flex;align-items:center;justify-content:center}
.padlock svg{width:24px;height:24px}

/* people */
.ava{flex:none;border-radius:50%;object-fit:cover;background:var(--green);color:var(--gold-hi);display:inline-flex;align-items:center;justify-content:center;font-family:var(--caps);font-weight:700;overflow:hidden;border:1px solid var(--line)}
.ava.vip{border:0;box-shadow:0 0 0 2px var(--desk),0 0 0 4px var(--gold-hi),0 0 16px rgba(227,206,150,.35)}
.paper .ava.vip{box-shadow:0 0 0 2px var(--ivory),0 0 0 4px var(--gold)}
.who{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.who b{font-weight:600}
.who .un{font-size:13px;color:var(--muted);font-weight:500}
.vipmark{font-family:var(--caps);font-size:10px;font-weight:700;letter-spacing:.12em;background:var(--foil);color:#141716;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.profile-hero{border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.profile-hero .band{height:86px;background:var(--green)}
.profile-hero .inner{padding:0 20px 20px;margin-top:-44px}
.profile-hero h1{font-size:26px;margin-top:10px}
.mission{font-family:var(--serif);font-size:19px;line-height:1.45;margin-top:10px;border-left:2px solid var(--gold);padding-left:12px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:2px solid var(--desk);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatches button.on{box-shadow:0 0 0 2px var(--gold-hi)}

/* lounge */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-bottom:6px}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;background:var(--panel);cursor:pointer;color:var(--text)}
.chip.on{background:var(--foil);color:var(--char);border-color:transparent}
.thread{display:block;width:100%;text-align:left;background:linear-gradient(180deg,#19342F,#132925);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;cursor:pointer;color:var(--text)}
.thread:hover{border-color:var(--gold)}
.thread.sealed{border-style:dashed;background:transparent;color:var(--muted)}
.thread h3{font-family:var(--sans);font-size:17px;font-weight:600;margin-bottom:6px;color:inherit}
.meta{font-size:13px;color:var(--muted)}
.post{padding:14px 0;border-top:1px solid #e1d9c8}
.post .txt{white-space:pre-wrap;margin-top:8px}

/* journal */
.gate-top{display:flex;align-items:center;gap:12px}
.gate-num{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--gold);color:var(--gold-ink);font-family:var(--caps);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
.gate-emotion{font-family:var(--serif);font-size:24px;color:var(--green)}
.gate-small{font-family:var(--caps);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5E615C}
.gate-signal{margin:10px 0 4px}
.gate-q{font-family:var(--serif);font-size:19px;margin:6px 0 10px;color:var(--green)}
.gate-locked{opacity:.55;box-shadow:none}
.gate-sealed{font-size:13px;font-weight:600;color:var(--gold-ink);margin-top:6px}
.blur{filter:blur(5px);user-select:none}
.rite{font-family:var(--caps);font-size:18px;font-weight:600;letter-spacing:.08em;display:inline-block}

/* admin */
.adm-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.adm-item:first-child{border-top:0}
.adm-item b{font-size:16px;display:block}
.adm-item .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.versions{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;flex-basis:100%}
.ver{padding:8px 0;border-top:1px dashed var(--line)}.ver:first-child{border-top:0}
.ver input[type=file]{font-size:14px;padding:8px}
.stats{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;text-align:center}
.stats b{display:block;font-family:var(--serif);font-size:30px;font-weight:400}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);padding-bottom:env(safe-area-inset-bottom)}
.nav::before{content:"";position:absolute;left:0;right:0;top:0;height:1.5px;background:var(--foil)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(var(--navn,4),1fr);height:var(--nav)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#93a09a;font-size:11px;font-weight:600;letter-spacing:.04em}
.nav a svg{width:23px;height:23px}
.nav a.on{color:var(--gold-hi)}

.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--bar);color:var(--ivory);padding:10px 18px;border-radius:10px;z-index:30;font-size:15px;max-width:90vw;text-align:center;border:1px solid var(--gold)}
.empty{text-align:center;color:var(--muted);padding:24px 0}
.hidden{display:none!important}
.foot{text-align:center;margin:30px 0 6px;font-size:14px;color:var(--muted);line-height:1.8}
.foot a{color:var(--muted);font-weight:500;margin:0 4px;white-space:nowrap}
.foot .fine{font-size:12.5px;margin-top:8px}
.foot .copy{display:block;font-size:clamp(10px,3.1vw,12.5px);white-space:nowrap;margin-top:12px;color:var(--gold)}
.legal h2{font-size:20px;margin:18px 0 6px}.legal ul{margin:0 0 10px 22px}.legal li{margin-bottom:6px}

/* accessibility */
.skip{position:absolute;left:-9999px;top:8px;z-index:50;background:var(--ivory);color:var(--char);padding:10px 14px;border-radius:10px}
.skip:focus{left:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px;border-radius:6px}
main:focus{outline:none}
html.big .app{zoom:1.15}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#app" onclick="document.getElementById('app').focus();return false;">Skip to content</a>
<main class="app" id="app" tabindex="-1"></main>
<nav class="nav" aria-label="Main"><div class="nav-in" id="nav"></div></nav>
<div id="live" class="sr" role="status" aria-live="polite"></div>

<script>
/* ============ ART ============ */
const EMBLEM = 'logo-emblem.png';
const WORDMARK = 'wordmark.jpg';
const I = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICONS = {

const ACCENTS = ['#B79B62','#2F6B4F','#7A2E3A','#24476B','#5B4B8A','#202423'];

/* ============ PREVIEW DATA (only used when Supabase keys are missing) ============ */
const PREVIEW = {
  volumes:[
    {id:'destiny-lock',title:'Destiny Lock',subtitle:'Seven short practices to protect your plans, energy, and timing.',status:'live',sort:1,kind:'pdf',tier:'free',category:'growth'},

  ],

  categories:[{id:9,name:'The Commons',tier:'member'},{id:1,name:'Introductions',tier:'member'},{id:2,name:'Destiny Lock Circle',tier:'vip'},{id:3,name:'Shadow Work',tier:'vip'},{id:4,name:'Vault Business',tier:'vip'}],
  people:{a:{id:'a',username:'Evergreen',display_name:'Evergreen',is_vip:true,is_admin:true,accent:'#B79B62',bio:'Building tools that help people own their path and their business.'},
          b:{id:'b',username:'wren_writes',display_name:'Wren',is_vip:false,bio:'Learning to guard my time.'}},
  threads:[
    {id:1,category_id:9,author_id:'b',title:'What is one boundary you set this week?',body:'Mine: no work email after 7 pm.',created_at:new Date().toISOString(),posts:[{id:1,author_id:'a',body:'Great one. Mine was saying no to a project that did not fit.',created_at:new Date().toISOString()}]},
    {id:2,category_id:2,author_id:'a',title:'Morning check-in: 7 days in a row',body:'Post your day count.',created_at:new Date().toISOString(),posts:[]}
  ]

/* ============ JOURNAL ============ */
const SEVEN_GATES = [   // n stays the same so saved journal entries keep working
  {n:'I',  emotion:'Fear',            signal:'Fear says: prepare for something.',                    q:'What do I need to prepare for? What is one small step I can take?'},
  {n:'II', emotion:'Guilt',           signal:'Guilt says: I broke one of my own rules.',             q:'Which rule did I break? How can I make it right today?'},
  {n:'III',emotion:'Anger',           signal:'Anger says: someone crossed a line.',                  q:'What line was crossed? What can I say or do so it stops?'},
  {n:'IV', emotion:'Hurt and Loneliness', signal:'Hurt says: I hoped for something that did not happen. Loneliness says: I need my people.', q:'What did I hope for? Who can I reach out to today?'},
  {n:'V',  emotion:'Frustration',     signal:'Frustration says: what I am doing is not working.',    q:'What keeps not working? What new approach can I try next?'},
  {n:'VI', emotion:'Disappointment',  signal:'Disappointment says: things did not go as I pictured.', q:'What did I expect? Should I change the goal or the plan?'},
  {n:'VII',emotion:'Not Good Enough', signal:'This feeling says: I need more skill or more support.', q:'Where do I feel not good enough? What can I learn, practice, or ask for?'}
];
const JOURNAL_PROMPTS = [
  'Where did I give away my power, my ideas, or my time without meaning to?',
  'What "almost" moment still stings? What did I share before it fell apart?',
  'Who do I feel entangled with? How would it feel to release them in peace?',
  'What good thing is meant for me that I have not claimed out loud yet?',
  'What did my dreams show me this week?'
];
const ROMAN = ['I','II','III','IV','V','VI','VII'];

/* ============ STATE ============ */
const S = { sb:null, preview:false, user:null, profile:null, isVip:false, isAdmin:false, vipUntil:null,
            volumes:[], allVolumes:[], levels:{}, pages:{}, cats:[], people:{}, demoVip:false, demoUser:false, demoAdmin:false };
const $app = document.getElementById('app');

/* ============ HELPERS ============ */
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when = iso => { try { return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'}); } catch(e){ return ''; } };
const longDate = d => new Date(d).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.setAttribute('aria-hidden','true'); t.textContent=msg; document.body.appendChild(t);
  const l=document.getElementById('live'); if(l){ l.textContent=''; setTimeout(()=>l.textContent=msg,50); } setTimeout(()=>t.remove(),4200); }
function store(key,val){ try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||'null'); localStorage.setItem(key,JSON.stringify(val)); }catch(e){ return null; } }
const signedIn = () => S.preview ? S.demoUser : !!S.user;
const vip = () => S.preview ? S.demoVip : S.isVip;
const admin = () => S.preview ? S.demoAdmin : S.isAdmin;
const canOpen = tier => tier==='free' || (tier==='member' && signedIn()) || vip() || admin();
const RANK = {free:0, member:1, vip:2};
const TIER_LABEL = {free:'Free', member:'Members', vip:'VIP'};
const LEVEL_LABEL = {free:'Free preview', member:'Members edition', vip:'Full edition'};
const KIND_LABEL = {booklet:'Guide', pdf:'Guide', audio:'Audio', video:'Video'};
const slug = s => String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || 'item';
const isFileItem = v => v && v.kind && v.kind !== 'booklet';
const paypalLive = () => ['new','active'].includes(S.profile?.paypal_status);
const myName = () => S.profile?.display_name || S.user?.email || 'Member';
const myId = () => S.preview ? 'me' : S.user?.id;
const bioLimit = () => (vip()||admin()) ? CONFIG.BIO_LIMIT.vip : CONFIG.BIO_LIMIT.member;

/* ============ PEOPLE ============ */
function initials(name){ return esc(String(name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()); }
function avatar(p, size=40){
  const cls = `ava ${p?.is_vip?'vip':''}`, st = `width:${size}px;height:${size}px;font-size:${Math.round(size*.38)}px`;
  return p?.avatar_url ? `<img class="${cls}" style="${st}" src="${esc(p.avatar_url)}" alt="">` : `<span class="${cls}" style="${st}" aria-hidden="true">${initials(p?.display_name||p?.username)}</span>`;
}
function whoLink(p, size=36){
  if(!p) return `<span class="who">${avatar(null,size)}<span><b>Member</b></span></span>`;
  return `<a class="who" href="#/u/${esc(p.username||p.id)}">${avatar(p,size)}<span><b>${esc(p.display_name||p.username)}</b>${p.is_vip?'<span class="vipmark">VIP</span>':''}${p.username?`<br><span class="un">@${esc(p.username)}</span>`:''}</span></a>`;
}
async function loadPeople(ids){
  const need=[...new Set(ids.filter(Boolean))].filter(id=>!S.people[id]);
  if(!need.length) return;
  if(S.preview){ need.forEach(id=>S.people[id]=PREVIEW.people[id]); return; }
  const { data } = await S.sb.from('public_profiles').select('*').in('id',need);
  (data||[]).forEach(p=>S.people[p.id]=p);
}

/* ============ PAYMENTS ============ */
function cryptoButton(uid, label){
  return uid ? `<span class="paybtn"><blockonomics-pay-button uid="${esc(uid)}" label="${esc(label)}"></blockonomics-pay-button></span>
    <p class="note" style="margin-top:8px"><a href="#/guide/crypto">New to crypto? Read the 5-step guide.</a></p>` : '<p class="note">Payments open soon.</p>';
}
function vipOffer(){
  const perks = `<ul class="ticks"><li>Every guide, audio, and video on the Shelf</li><li>All seven gates in the Shadow Journal</li><li>Every room in the VIP Lounge</li><li>A longer mission statement, an accent color, and a link on your profile</li></ul>`;
  if(!signedIn()) return `<div class="card vipcard"><h2>Become a VIP</h2><p><strong>${esc(CONFIG.VIP_PRICE_LABEL)}.</strong> Full access to the Vault:</p>${perks}
    <ol class="steps"><li>Create your free account.</li><li>Return here and choose Subscribe.</li></ol>
    <div class="row"><a class="btn gold" href="#/account" onclick="authTab='up'">Create Free Account</a></div></div>`;
  return `<div class="card vipcard"><h2>Become a VIP</h2><p><strong>${esc(CONFIG.VIP_PRICE_LABEL)}.</strong> Full access to the Vault:</p>${perks}
    <p>Subscribe with PayPal. It renews monthly, and you can cancel any time.</p><div class="pp-sub"></div>
    <details class="more"><summary>Prefer to pay with crypto?</summary>

      ${cryptoButton(CONFIG.PAY.membership,'Pay with Crypto')}

let ppLoading = false;
function loadPayPal(){
  if(window.paypal || ppLoading || S.preview || !CONFIG.PAYPAL.clientId) return;
  ppLoading = true;
  const s=document.createElement('script');
  s.src=`https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(CONFIG.PAYPAL.clientId)}&vault=true&intent=subscription`;
  s.setAttribute('data-sdk-integration-source','button-factory');
  s.onload=mountPayPal;
  s.onerror=()=>{ ppLoading=false; document.querySelectorAll('.pp-sub').forEach(el=>el.innerHTML='<p class="note" style="color:var(--char)">PayPal did not load. Please refresh the page.</p>'); };
  document.head.appendChild(s);
}
function mountPayPal(){
  const spots=[...document.querySelectorAll('.pp-sub:not([data-ready])')];
  if(!spots.length) return;
  if(S.preview){ spots.forEach(el=>{ el.dataset.ready='1'; el.innerHTML='<p class="note" style="color:var(--char);text-align:center;padding:10px">Preview: the PayPal Subscribe button appears here on the live app.</p>'; }); return; }
  if(!window.paypal) return loadPayPal();
  spots.forEach(el=>{
    el.dataset.ready='1';
    window.paypal.Buttons({
      style:{ shape:'rect', color:'gold', layout:'vertical', label:'subscribe' },
      createSubscription:(data, actions)=>actions.subscription.create({ plan_id: CONFIG.PAYPAL.planId, custom_id: S.user?.id || undefined }),
      onApprove: async (data)=>{
        const { error } = await S.sb.rpc('record_paypal_subscription',{ p_sub: data.subscriptionID });
        if(error){ toast('Thank you. Your payment went through. If VIP does not turn on soon, please email us.'); return; }
        await loadProfile(); toast('Thank you. You are now a VIP.');
        location.hash='#/account'; route();
      },
      onError: ()=>toast('PayPal had a problem. Please try again.')
    }).render(el).catch(()=>{});
  });
}

/* ============ DATA ============ */
async function loadProfile(){
  if(S.preview){ S.profile = S.profile || {display_name:'Preview Member', username:'preview'}; return; }
  if(!S.user){ S.profile=null; S.isVip=false; S.isAdmin=false; S.vipUntil=null; return; }
  let { data, error } = await S.sb.rpc('my_profile');
  if(error){ ({ data } = await S.sb.from('profiles').select('display_name,is_vip,is_admin,vip_source,vip_until').eq('id',S.user.id).maybeSingle()); }
  S.profile = data || {};
  S.isAdmin = !!S.profile.is_admin;
  S.vipUntil = S.profile.vip_until ? new Date(S.profile.vip_until) : null;
  S.isVip = !!S.profile.is_vip || S.isAdmin || (!!S.vipUntil && S.vipUntil > new Date()) || paypalLive();
  delete S.people[S.user.id];
}
async function loadVolumes(){
  if(S.preview){ S.allVolumes=S.volumes=PREVIEW.volumes; S.levels=PREVIEW.levels; return; }
  const { data, error } = await S.sb.from('volumes').select('*').order('sort');
  if(error) toast('The Shelf did not load. Please try again.');
  S.allVolumes = data || [];
  S.volumes = S.allVolumes.filter(v=>v.status!=='hidden');
  const lv = await S.sb.rpc('shelf_levels');
  S.levels = Object.fromEntries((lv.data||[]).map(r=>[r.volume_id, r.levels]));
}
async function loadPages(volId){
  if(S.pages[volId]) return S.pages[volId];
  if(S.preview) return (S.pages[volId]=[]);
  const { data } = await S.sb.from('pages').select('id,volume_id,sort,title,tier,teaser,page_bodies(body)').eq('volume_id',volId).order('sort');
  S.pages[volId] = (data||[]).map(p=>({...p, body: Array.isArray(p.page_bodies) ? p.page_bodies[0]?.body : p.page_bodies?.body }));
  return S.pages[volId];
}

/* ============ NAV + HEADER + FOOTER ============ */
function renderNav(active){
  const items=[['shelf','Shelf','#/shelf'],['guild','VIP Lounge','#/guild'],['journal','Journal','#/journal'],['account','Account','#/account']];

/* ============ SHELF ============ */
function poster(v, clone){
  const locked = !canOpen(v.tier||'free');
  const lv = S.levels[v.id];
  const level = lv && lv.length ? (lv.includes('free') ? 'Free preview' : TIER_LABEL[lv[0]]) : TIER_LABEL[v.tier||'free'];
  const sub = v.subtitle ? esc(v.subtitle) : '';
  const cover = v.cover_url ? `<img class="full" src="${esc(v.cover_url)}" alt="">${sub?`<span class="ov">${sub}</span>`:''}`
    : `<img class="em" src="${EMBLEM}" alt=""><span class="mid"><span class="ct">${esc(v.title)}</span>${sub?`<span class="cs">${sub}</span>`:''}</span><span class="ck">${esc(KIND_LABEL[v.kind||'booklet'])}</span>`;
  return `<button class="poster" data-vol="${esc(v.id)}" ${clone?'aria-hidden="true" tabindex="-1"':''} aria-label="${esc(v.title)}${sub?': '+sub:''}${locked?' (locked)':''}">
    <div class="cover ${v.cover_url?'':'gen'}">${locked&&!(lv&&lv.includes('free'))?`<span class="lock">${ICONS.lock}</span>`:''}${cover}</div>
    <div class="pt">${esc(v.title)}</div><div class="pl">${esc(KIND_LABEL[v.kind||'booklet'])} · ${esc(level)}</div></button>`;
}
function shelfRow(key, label){
  const items = S.volumes.filter(v=>(v.category||'misc')===key);
  const loop = items.length >= 3;
  const cards = items.length ? (loop ? [...items.map(v=>poster(v,true)),...items.map(v=>poster(v,false)),...items.map(v=>poster(v,true))].join('') : items.map(v=>poster(v,false)).join(''))
              : `<div class="soon">New titles coming soon</div>`;
  return `<section class="shelfrow" aria-label="${esc(label)}"><div class="eyebrow">${esc(label)}</div>
    ${items.length>1?`<button class="arrow l" data-dir="-1" aria-label="Previous in ${esc(label)}">‹</button><button class="arrow r" data-dir="1" aria-label="Next in ${esc(label)}">›</button>`:''}
    <div class="track" data-n="${items.length}" data-loop="${loop?1:0}">${cards}</div></section>`;
}
function setupRows(){
  document.querySelectorAll('.shelfrow').forEach(row=>{
    const track=row.querySelector('.track'); const n=+track.dataset.n; const loop=track.dataset.loop==='1';
    const first=track.querySelector('.poster'); if(!first) return;
    const step = first.getBoundingClientRect().width + 14;
    if(loop){
      // Three copies of the row; we keep you in the middle copy so it never runs out.
      const setW = step*n;
      track.scrollLeft = setW;
      let t; track.addEventListener('scroll',()=>{ clearTimeout(t); t=setTimeout(()=>{
        if(track.scrollLeft < setW*0.5) track.scrollLeft += setW;
        else if(track.scrollLeft >= setW*1.5) track.scrollLeft -= setW; },140); },{passive:true});
    }
    row.querySelectorAll('.arrow').forEach(a=>a.onclick=()=>{
      const d=+a.dataset.dir;
      if(!loop && d>0 && track.scrollLeft + track.clientWidth >= track.scrollWidth - 4) return track.scrollTo({left:0,behavior:'smooth'});
      if(!loop && d<0 && track.scrollLeft <= 4) return track.scrollTo({left:track.scrollWidth,behavior:'smooth'});
      track.scrollBy({left:d*step,behavior:'smooth'});
    });
  });
}
async function viewShelf(){
  renderNav('shelf');
  $app.innerHTML = header()+'<div class="empty">Opening the Vault…</div>';
  await loadVolumes();
  $app.innerHTML = header()+`<img class="banner" src="${WORDMARK}" alt="MindOnesBusiness">
  ${hero('The Shelf','Practical guides for personal growth and business. Swipe each row to browse.')}

/* ---- Items: PDF / audio / video ---- */
function embedUrl(u){
  const y = String(u).match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/);
  if(y) return 'https://www.youtube-nocookie.com/embed/'+y[1];
  const m = String(u).match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(m) return 'https://player.vimeo.com/video/'+m[1];
  return null;
}
async function fileUrl(f){
  if(!f || !f.file_path) return '';
  if(f.bucket==='site') return f.file_path;
  if(f.bucket==='shelf-public') return S.sb.storage.from('shelf-public').getPublicUrl(f.file_path).data.publicUrl;
  const { data } = await S.sb.storage.from('shelf-sealed').createSignedUrl(f.file_path, 3600);
  return data?.signedUrl || '';
}
async function pdfjs(){
  if(!window.__pdfjs){ const m = await import(CONFIG.PDFJS.lib); m.GlobalWorkerOptions.workerSrc = CONFIG.PDFJS.worker; window.__pdfjs = m; }
  return window.__pdfjs;
}
let pdfZoom = 1;
async function renderPdf(url, box){
  box.innerHTML = '<p class="empty">Opening…</p>';
  try{
    const lib = await pdfjs();
    const doc = await lib.getDocument({ url }).promise;
    box.innerHTML = '';
    const width = Math.min(box.clientWidth || 360, 900);
    for(let i=1;i<=doc.numPages;i++){
      const page = await doc.getPage(i);
      const base = page.getViewport({ scale:1 });
      const scale = (width - 8) / base.width * pdfZoom;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const vp = page.getViewport({ scale: scale * dpr });
      const fig = document.createElement('figure'); fig.className='pdfpage';
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
      c.style.width = (vp.width/dpr)+'px'; c.setAttribute('role','img'); c.setAttribute('aria-label',`Page ${i}`);
      const cap = document.createElement('figcaption'); cap.textContent = `Page ${i} of ${doc.numPages}`;
      fig.append(c, cap); box.appendChild(fig);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    }
  }catch(e){
    console.error(e);
    box.innerHTML = `<p class="empty">The guide did not open here.</p><div class="row" style="justify-content:center"><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Open the PDF</a></div>`;
  }
}
function upgradeNote(have, levels){
  const top = levels.reduce((a,t)=>RANK[t]>RANK[a]?t:a, have);
  if(RANK[top] <= RANK[have]) return '';
  if(have==='free' && levels.includes('member') && !signedIn())
    return `<div class="card" style="text-align:center"><h2>Keep reading</h2><p>This is the free preview. Create a free account to read the members edition.</p><a class="btn" href="#/account" onclick="authTab='up'">Create Free Account</a></div>`;
  return `<div class="card vipcard" style="text-align:center"><h2>Read the full edition</h2><p>VIPs get the full guide and everything else in the Vault.</p><a class="btn gold" href="#/account">Become a VIP</a></div>`;
}

function bindPdf(url){
  const box=document.getElementById('pdfbox');
  document.getElementById('zIn').onclick=()=>{ pdfZoom=Math.min(2.5,pdfZoom+0.25); renderPdf(url, box); };
  document.getElementById('zOut').onclick=()=>{ pdfZoom=Math.max(0.75,pdfZoom-0.25); renderPdf(url, box); };
  renderPdf(url, box);
}

async function uploadCover(file){

async function resizeImage(file, size=320){
  const src=URL.createObjectURL(file);
  try{
    const img = await new Promise((ok,bad)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>bad(new Error('That image did not open. Try a JPG or PNG.')); i.src=src; });
    const s=Math.min(img.width,img.height), c=document.createElement('canvas'); c.width=c.height=size;
    c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);
    return await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.86));
  } finally { URL.revokeObjectURL(src); }
}

      p_bio: bio.value.trim()||null, p_avatar_url: ('avatar' in extra)?extra.avatar:(p.avatar_url||null),
      p_accent: isV?accent:null, p_link: isV?(document.getElementById('pLink').value.trim()||null):null };
    if(args.p_username && !/^[A-Za-z0-9_]{3,20}$/.test(args.p_username)) { toast('Usernames are 3 to 20 letters, numbers, or underscores.'); return false; }
    if(args.p_link && !/^https:\/\//i.test(args.p_link)) { toast('Links must start with https://'); return false; }
    if(S.preview){ Object.assign(S.profile,{display_name:args.p_display_name,username:args.p_username,bio:args.p_bio,accent:args.p_accent,link:args.p_link}); toast('Preview: profile saved.'); viewAccount(); return true; }
    const { error } = await S.sb.rpc('update_my_profile', args);
    if(error){ toast(error.message); return false; }
    await loadProfile(); toast('Profile saved.'); viewAccount(); return true;
  };
  document.getElementById('pSave').onclick=()=>save();
  const ph=document.getElementById('pPhoto');
  ph.onchange=async()=>{ const f=ph.files[0]; if(!f) return;
    if(S.preview) return toast('Preview mode: photo uploads work on the live app.');
    try{ const blob=await resizeImage(f); const path=`${S.user.id}/${Date.now()}.jpg`;
      const { error } = await S.sb.storage.from('avatars').upload(path, blob, { contentType:'image/jpeg', upsert:false }); if(error) throw error;
      const url=S.sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
      const old=S.profile?.avatar_url;
      if(await save({avatar:url})){ if(old && old.includes('/avatars/')){ const op=old.split('/avatars/')[1]; if(op) S.sb.storage.from('avatars').remove([op]); } }
      else S.sb.storage.from('avatars').remove([path]);
    }catch(e){ toast(e.message||'Photo upload failed.'); } };
  const rm=document.getElementById('pPhotoRm'); if(rm) rm.onclick=async()=>{
    const old=S.profile?.avatar_url;
    if(await save({avatar:null}) && !S.preview && old && old.includes('/avatars/')){ const op=old.split('/avatars/')[1]; if(op) S.sb.storage.from('avatars').remove([op]); } };
}

async function doAuth(){
  const id=document.getElementById('aEmail').value.trim(), pass=document.getElementById('aPass').value;
  if(!id||pass.length<8) return toast('Enter your details and a password of 8 or more characters.');
  if(S.preview){ S.demoUser=true; toast('Preview: you are signed in.'); return viewAccount(); }
  const btn=document.getElementById('aGo'); btn.disabled=true;
  try{
    if(authTab==='up'){
      const username=document.getElementById('aUser').value.trim();
      if(!/^[A-Za-z0-9_]{3,20}$/.test(username)) return toast('Usernames are 3 to 20 letters, numbers, or underscores.');
      if(!id.includes('@')) return toast('Please enter a valid email address.');
      const { data:free } = await S.sb.rpc('username_available',{p_username:username});
      if(free===false) return toast('That username is taken. Please try another.');
      const name=(document.getElementById('aName').value.trim()||username).slice(0,40);
      const { data, error } = await S.sb.auth.signUp({email:id,password:pass,options:{data:{display_name:name, username, marketing_opt_in: !!document.getElementById('aOpt')?.checked},emailRedirectTo:location.origin}});
      if(error) return toast(error.message);
      if(!data.session) return toast('Almost done. Check your email and tap the confirmation link.');
    } else {
      let email=id;
      if(!id.includes('@')){
        const { data, error } = await S.sb.rpc('login_email',{p_username:id,p_password:pass});
        if(error) return toast(error.message);
        if(!data) return toast('That username and password do not match.');
        email=data;
      }
      const { error } = await S.sb.auth.signInWithPassword({email,password:pass});
      if(error) return toast(error.message==='Invalid login credentials'?'That sign-in and password do not match.':error.message);
    }
  } finally { if(document.body.contains(btn)) btn.disabled=false; }
}
async function redeem(){
  const code=document.getElementById('code').value.trim().toUpperCase(); if(!code) return;
  if(S.preview){ S.demoVip=true; toast('Preview: you are a VIP.'); return viewAccount(); }
  const { data, error } = await S.sb.rpc('redeem_vip_code',{p_code:code});
  if(error) return toast(error.message);
  if(!data) return toast('That key is not valid, or it was already used.');
  await loadProfile(); S.pages={}; toast('Welcome to VIP.'); viewAccount();
}

/* ============ ROUTER ============ */
async function route(){
  window.scrollTo(0,0);
  const parts=(location.hash||'#/shelf').slice(2).split('/');
  try{
    if(parts[0]==='read') return await viewReader(decodeURIComponent(parts[1]), +parts[2]||0);
    if(parts[0]==='item') return await viewItem(decodeURIComponent(parts[1]));
    if(parts[0]==='guild') return parts[1] ? await viewThread(parts[1]) : await viewGuild();
    if(parts[0]==='u') return await viewProfile(decodeURIComponent(parts[1]||''));
    if(parts[0]==='admin') return parts[1]==='members' ? await viewMembers() : await viewAdmin();
    if(parts[0]==='guide') return viewCryptoGuide();
    if(parts[0]==='legal') return viewLegal(parts[1]);
    if(parts[0]==='journal') return viewJournal();
    if(parts[0]==='account') return viewAccount();
    return await viewShelf();
  }catch(e){ console.error(e); $app.innerHTML=header()+'<div class="empty">Something went wrong. Please refresh.</div>'; }
}

/* ============ START ============ */
(async function init(){
  if(store('mobvault.bigtext')) document.documentElement.classList.add('big');
  new MutationObserver(()=>{
    if(!$app.querySelector('.foot')) $app.insertAdjacentHTML('beforeend', `<footer class="foot">${copyright()}</footer>`);
    mountPayPal();
  }).observe($app,{childList:true});
  S.preview = CONFIG.SUPABASE_URL.includes('YOUR-') || !window.supabase;
  if(!S.preview){
    S.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    const { data } = await S.sb.auth.getSession(); S.user = data.session?.user || null;
    await loadProfile();
    S.sb.auth.onAuthStateChange(async (_e, session)=>{
      const was=S.user?.id; S.user=session?.user||null;
      if(was!==S.user?.id){ await loadProfile(); S.pages={}; route(); }
    });
  } else { await loadProfile(); }
  window.addEventListener('hashchange', route);
  route();
  if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
