<style>
:root{
  --paper:#faf7f0; --grid:#f3dfc4; --ink:#1f1630; --muted:#5a4f63; --card:#ffffff;
  --c1:#c2410c; --c2:#6d28d9; --c3:#15803d; --c4:#1d4ed8; --c5:#b91c1c; --gold:#f5b301;
  --b1:#f97316; --b2:#7c3aed; --b3:#16a34a; --b4:#1f1630;
  --sec:var(--c1); --nav:74px; --r:22px;
}
body[data-sec=shelf]{--sec:var(--c1)} body[data-sec=guild]{--sec:var(--c2)}
body[data-sec=journal]{--sec:var(--c3)} body[data-sec=account]{--sec:var(--c4)} body[data-sec=admin]{--sec:var(--c5)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background-color:var(--paper); color:var(--ink);
  font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:18px; line-height:1.6;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
h1,h2,h3{font-family:'Poppins',system-ui,sans-serif;font-weight:800;line-height:1.2;color:var(--ink)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--c4);font-weight:600}
.app{max-width:600px;margin:0 auto;min-height:100%;padding:0 16px calc(var(--nav) + env(safe-area-inset-bottom) + 24px)}

/* bunting (classroom flags) */
.bunting{display:flex;height:26px;margin:0 -16px 10px;padding-top:env(safe-area-inset-top)}
.bunting span{flex:1;clip-path:polygon(0 0,100% 0,50% 100%);margin:0 1px}
.bunting span:nth-child(4n+1){background:var(--b1)}.bunting span:nth-child(4n+2){background:var(--b2)}
.bunting span:nth-child(4n+3){background:var(--b3)}.bunting span:nth-child(4n+4){background:var(--b4)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand img{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);display:block}
.brand b{display:block;font-weight:800;font-size:21px;letter-spacing:.01em;line-height:1.1}
.brand small{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.badge{font-weight:800;font-size:12px;letter-spacing:.08em;padding:6px 12px;border-radius:999px;border:3px solid var(--ink);background:#fff;white-space:nowrap}
.badge.member{background:#dbeafe}.badge.key{background:var(--gold)}.badge.admin{background:var(--c5);color:#fff;border-color:var(--c5)}
.preview-bar{font-size:13px;font-weight:700;text-align:center;padding:8px;border:2px dashed var(--c5);border-radius:12px;color:var(--c5);background:#fff;margin-bottom:12px}

/* hero */
.hero{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.hero .art{width:58px;height:58px;flex:none}
.hero h1{font-size:30px}
.hero p{color:var(--muted);font-size:17px;margin-top:2px}
.section-title{display:inline-block;font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--sec);padding:4px 14px;border-radius:999px;margin:8px 0 12px}

/* cards */
.card{background:var(--card);border:3px solid var(--sec);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:5px 5px 0 var(--sec);position:relative}
.card.ink{border-color:var(--ink);box-shadow:5px 5px 0 var(--ink)}
.card.gold{border-color:var(--ink);box-shadow:5px 5px 0 var(--gold);background:#fffbea}
.card.dash{border-style:dashed;box-shadow:none}
.card h2{font-size:22px;margin-bottom:6px}
.card p{margin-bottom:10px}
.card p:last-child{margin-bottom:0}
.note{font-size:15px;color:var(--muted)}
.big-list{list-style:none;margin:8px 0 12px}
.big-list li{padding-left:34px;position:relative;margin:8px 0;font-weight:500}
.big-list li::before{content:"";position:absolute;left:4px;top:7px;width:18px;height:18px;border-radius:5px;background:var(--sec);transform:rotate(45deg) scale(.8)}
.steps{list-style:none;counter-reset:s;margin:6px 0}
.steps li{counter-increment:s;padding-left:46px;position:relative;margin:10px 0}
.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:34px;height:34px;border-radius:50%;background:var(--sec);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;border:3px solid var(--ink);
  background:var(--sec);color:#fff;font-weight:800;font-size:17px;cursor:pointer;text-decoration:none;min-height:50px;box-shadow:0 4px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.white{background:#fff;color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.danger{background:#fff;color:var(--c5);border-color:var(--c5);box-shadow:0 4px 0 var(--c5)}
.btn.small{min-height:40px;padding:6px 14px;font-size:14px;box-shadow:0 3px 0 var(--ink)}
.btn.big{font-size:20px;padding:16px 30px;min-height:60px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
label{display:block;font-weight:700;font-size:15px;margin:12px 0 6px}
input,textarea,select{width:100%;background:#fff;border:3px solid #cfc6d6;border-radius:14px;padding:12px 14px;font-size:17px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--sec)}
textarea{min-height:120px;resize:vertical}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tabs button{flex:1;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px;font-weight:800;cursor:pointer}
.tabs button.on{background:var(--sec);color:#fff}
.optin{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:16px;margin:14px 0 0;cursor:pointer}
.optin input{width:24px;height:24px;flex:none;margin-top:2px;accent-color:var(--sec)}
details.more{margin-top:14px;border-top:2px dashed #d8cfe0;padding-top:12px}
details.more summary{font-weight:700;cursor:pointer;color:var(--c4)}
.paybtn{display:block;margin-top:10px}
.pp-sub{margin-top:10px;max-width:420px}
blockonomics-pay-button:not(:defined)::before{content:"Loading the pay button…";font-style:italic;color:var(--muted)}

/* shelf */
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.book{display:flex;flex-direction:column;border:3px solid var(--ink);border-radius:var(--r);background:#fff;overflow:hidden;cursor:pointer;text-align:left;padding:0;box-shadow:5px 5px 0 var(--ink);transition:transform .1s}
.book:active{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}
.book .cover{position:relative;height:130px;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
.book .cover svg.ico{width:58px;height:58px;position:relative;z-index:1}
.book .cover i{position:absolute;opacity:.28;background:#fff}
.book .cover i.c{width:70px;height:70px;border-radius:50%;top:-18px;right:-14px}
.book .cover i.t{width:0;height:0;background:none;border-left:34px solid transparent;border-right:34px solid transparent;border-bottom:56px solid #fff;bottom:-10px;left:-8px}
.book .cover i.s{width:26px;height:26px;border-radius:6px;bottom:14px;right:16px;transform:rotate(20deg)}
.book .cover .lock{position:absolute;top:10px;left:10px;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;z-index:2;border:2px solid var(--ink)}
.book .cover .lock svg{width:18px;height:18px}
.book .info{padding:12px}
.book h3{font-size:17px;line-height:1.25}
.book p{font-size:14px;color:var(--muted);line-height:1.35;margin-top:4px}
.pill{display:inline-block;white-space:nowrap;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:2px solid var(--ink);margin:8px 4px 0 0;background:#fff}
.pill.free{background:#dcfce7}.pill.member{background:#dbeafe}.pill.vip{background:var(--gold)}

/* reader */
.reader-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.back{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 16px;font-weight:800;cursor:pointer}
.counter{font-weight:700;color:var(--muted);font-size:15px}
.reader-title{font-size:26px;margin-bottom:6px}
.pdfbox{overflow-x:auto;margin:12px 0}
.pdfpage{margin:0 0 16px;text-align:center}
.pdfpage canvas{display:block;margin:0 auto;border:3px solid var(--ink);border-radius:10px;background:#fff;box-shadow:4px 4px 0 var(--sec)}
.pdfpage figcaption{font-size:13px;font-weight:700;color:var(--muted);margin-top:6px}
.zoom{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.upgrade{text-align:center}
.media.audio{width:100%;margin:8px 0}
video.media{width:100%;border-radius:14px;border:3px solid var(--ink);background:#000}
.vidwrap{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;border:3px solid var(--ink)}
.vidwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.page-card{background:#fff;border:3px solid var(--ink);border-radius:var(--r);padding:20px;box-shadow:5px 5px 0 var(--sec);min-height:50vh;
  background-image:linear-gradient(transparent 31px,#dbe4f3 32px);background-size:100% 32px}
.page-card .body p{margin-bottom:12px}.page-card .body ul,.page-card .body ol{margin:0 0 12px 22px}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:12px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:#d8cfe0;border:2px solid var(--ink)}.dot.on{background:var(--sec)}
.locked{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:10px 0}
.locked .padlock{width:84px;height:84px;border-radius:50%;background:var(--gold);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center}
.locked .padlock svg{width:40px;height:40px}

/* guild */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:6px}
.chip{flex:none;border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:700;background:#fff;cursor:pointer}
.chip.on{background:var(--sec);color:#fff}
.thread{display:block;width:100%;text-align:left;background:#fff;border:3px solid var(--ink);border-left:12px solid var(--sec);border-radius:16px;padding:14px;margin-bottom:12px;cursor:pointer}
.thread.sealed{border-style:dashed;border-left-style:solid;border-left-color:#bdb3c7;opacity:.8}
.thread h3{font-size:18px;font-weight:700}
.meta{font-size:14px;color:var(--muted);margin-top:4px}
.post{border-left:5px solid var(--sec);padding:6px 0 6px 14px;margin:14px 0;background:#faf7ff;border-radius:0 12px 12px 0}
.post .who{font-weight:800;color:var(--sec)}
.post .txt{white-space:pre-wrap}

/* journal */
.gate{border-color:var(--gc);box-shadow:5px 5px 0 var(--gc)}
.gate-top{display:flex;align-items:center;gap:12px}
.gate-num{width:46px;height:46px;flex:none;border-radius:50%;background:var(--gc);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink)}
.gate-num.dark{color:var(--ink)}
.gate-emotion{font-size:26px;font-weight:800}
.gate-small{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gate-signal{margin:10px 0 6px}
.gate-q{font-size:19px;font-weight:700;margin:6px 0 10px}
.gate-locked{opacity:.6;box-shadow:none;border-style:dashed}
.gate-sealed{font-weight:800;font-size:14px;color:var(--muted);margin-top:8px}
.blur{filter:blur(5px);user-select:none}
.rite{font-size:22px;font-weight:800;color:var(--c3);letter-spacing:.02em}

/* admin */
.adm-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 0;border-top:2px dashed #ddd3e6}
.adm-item:first-child{border-top:0}
.adm-item b{font-size:17px;display:block}
.adm-item .btns{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.versions{background:#fff6f6;border:2px solid var(--c5);border-radius:14px;padding:12px;margin-top:10px}
.ver{padding:8px 0;border-top:1px dashed #e7c6c6}.ver:first-child{border-top:0}
.ver input[type=file]{font-size:14px;padding:8px}
.stats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;text-align:center}
.stats b{display:block;font-size:28px;font-weight:800;color:var(--sec)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:3px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(var(--navn,4),1fr);height:var(--nav)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:700}
.nav a svg{width:26px;height:26px;padding:3px;border-radius:10px}
.nav a.on{color:var(--ink)}
.nav a.on svg{background:var(--navc);color:#fff}
.nav a[data-k=shelf]{--navc:var(--c1)}.nav a[data-k=guild]{--navc:var(--c2)}.nav a[data-k=journal]{--navc:var(--c3)}.nav a[data-k=account]{--navc:var(--c4)}.nav a[data-k=admin]{--navc:var(--c5)}

.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:600;padding:10px 18px;border-radius:999px;z-index:30;font-size:16px;max-width:90vw;text-align:center}
.empty{text-align:center;color:var(--muted);padding:24px 0;font-weight:600}
.hidden{display:none!important}
.foot{text-align:center;margin:30px 0 6px;font-size:15px;color:var(--muted);line-height:1.8}
.foot a{color:var(--muted);margin:0 6px;white-space:nowrap}
.foot .fine{font-size:13px;margin-top:8px}
.foot .copy{display:block;font-size:clamp(10px,3.1vw,13px);white-space:nowrap;margin-top:12px}
.legal h2{font-size:19px;margin:16px 0 6px}.legal ul{margin:0 0 10px 22px}.legal li{margin-bottom:6px}
.spooky{display:none}
html.spook .spooky{display:block}

/* accessibility */
.skip{position:absolute;left:-9999px;top:8px;z-index:50;background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px}
.skip:focus{left:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--c4);outline-offset:3px;border-radius:8px}
main:focus{outline:none}
html.big .app{zoom:1.18}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

function embedUrl(u){
  const y = String(u).match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/);
  if(y) return 'https://www.youtube-nocookie.com/embed/'+y[1];
  const m = String(u).match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(m) return 'https://player.vimeo.com/video/'+m[1];
  return null;
}
async function fileUrl(f){
  if(!f || !f.file_path) return '';
  if(f.bucket==='site') return f.file_path;
  if(f.bucket==='shelf-public') return S.sb.storage.from('shelf-public').getPublicUrl(f.file_path).data.publicUrl;
  const { data } = await S.sb.storage.from('shelf-sealed').createSignedUrl(f.file_path, 3600);
  return data?.signedUrl || '';
}
async function pdfjs(){
  if(!window.__pdfjs){ const m = await import(CONFIG.PDFJS.lib); m.GlobalWorkerOptions.workerSrc = CONFIG.PDFJS.worker; window.__pdfjs = m; }
  return window.__pdfjs;
}
let pdfZoom = 1;
async function renderPdf(url, box){
  box.innerHTML = '<p class="empty">Opening the book…</p>';
  try{
    const lib = await pdfjs();
    const doc = await lib.getDocument({ url }).promise;
    box.innerHTML = '';
    const width = Math.min(box.clientWidth || 360, 900);
    for(let i=1;i<=doc.numPages;i++){
      const page = await doc.getPage(i);
      const base = page.getViewport({ scale:1 });
      const scale = (width - 8) / base.width * pdfZoom;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const vp = page.getViewport({ scale: scale * dpr });
      const fig = document.createElement('figure'); fig.className='pdfpage';
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
      c.style.width = (vp.width/dpr)+'px'; c.setAttribute('role','img'); c.setAttribute('aria-label',`Page ${i}`);
      const cap = document.createElement('figcaption'); cap.textContent = `Page ${i} of ${doc.numPages}`;
      fig.append(c, cap); box.appendChild(fig);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    }
  }catch(e){
    console.error(e);
    box.innerHTML = `<p class="empty">The book did not open here.</p><div class="row" style="justify-content:center"><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Open the PDF</a></div>`;
  }
}
function upgradeNote(have, levels){
  const top = levels.reduce((a,t)=>RANK[t]>RANK[a]?t:a, have);
  if(RANK[top] <= RANK[have]) return '';
  if(have==='free' && levels.includes('member') && !signedIn())
    return `<div class="card upgrade" style="--sec:var(--c3)"><h2>Want to read more?</h2><p>This is the free peek. Make a free account to read more.</p><a class="btn big" href="#/account" onclick="authTab='up'">Join Free</a></div>`;
  return `<div class="card gold upgrade"><h2>Want the whole book?</h2><p>VIPs get the full book and everything else in the Vault.</p><a class="btn gold" href="#/account">Become a VIP</a></div>`;
}
async function viewItem(id){
  renderNav('shelf');
  if(!S.volumes.length) await loadVolumes();
  const v = S.volumes.find(x=>x.id===id);
  if(!v){ $app.innerHTML=header()+'<div class="empty">Nothing here yet.</div>'; return; }
  const frame = inner => header()+`
  <div class="reader-head"><button class="back" onclick="location.hash='#/shelf'">‹ Shelf</button><span class="counter">${esc(KIND_LABEL[v.kind]||'')}</span></div>
  <h1 class="reader-title">${esc(v.title)}</h1>${v.subtitle?`<p class="note" style="font-size:17px">${esc(v.subtitle)}</p>`:''}${inner}`;
  const levels = S.levels[id] || [];

  // Items with a free peek / members copy / full copy
  if(levels.length){
    let ver=null;
    if(S.preview){ const t=[...levels].sort((a,b)=>RANK[b]-RANK[a]).find(t=>canOpen(t)); const p=t&&PREVIEW.versions[id]?.[t]; ver = t ? {tier:t, bucket:p?'site':null, file_path:p} : null; }
    else { const { data } = await S.sb.from('shelf_versions').select('tier,bucket,file_path').eq('volume_id',id); ver=(data||[]).sort((a,b)=>RANK[b.tier]-RANK[a.tier])[0]||null; }
    if(!ver){ const low=[...levels].sort((a,b)=>RANK[a]-RANK[b])[0];
      $app.innerHTML = frame(`<div class="card" style="text-align:center"><div class="locked">${padlock()}<p>${low==='member'?'Make a free account to open this.':'This is for VIPs.'}</p>${unlockBtn(low)}</div></div>`); return; }
    if(!ver.file_path){ $app.innerHTML = frame(`<div class="card dash"><p>Preview: the ${esc(TIER_LABEL[ver.tier])} copy opens here on the live app.</p></div>${upgradeNote(ver.tier, levels)}`); return; }
    const url = await fileUrl(ver);
    $app.innerHTML = frame(`${ver.tier!=='vip'&&levels.length>1?`<p style="margin:8px 0"><span class="pill ${ver.tier}">You are reading: ${LEVEL_PILL[ver.tier]}</span></p>`:''}
      <div class="zoom"><button class="btn white small" id="zOut">Smaller</button><button class="btn white small" id="zIn">Bigger</button><a class="btn small" href="${esc(url)}" target="_blank" rel="noopener">Open PDF</a></div>
      <div class="pdfbox" id="pdfbox"></div>${upgradeNote(ver.tier, levels)}`);
    bindPdf(url); return;
  }

  // Single-file items
  if(!canOpen(v.tier||'free')){
    $app.innerHTML = frame(`<div class="card" style="text-align:center"><div class="locked">${padlock()}<p>${v.tier==='member'?'Make a free account to open this.':'This is for VIPs.'}</p>${unlockBtn(v.tier)}</div></div>`); return;
  }
  if(S.preview){ $app.innerHTML = frame(`<div class="card dash"><p>Preview: the ${esc(KIND_LABEL[v.kind])} opens here on the live app.</p></div>`); return; }
  $app.innerHTML = frame('<div class="empty">Opening…</div>');
  const { data:f } = await S.sb.from('shelf_files').select('bucket,file_path,video_url').eq('volume_id',id).maybeSingle();
  if(!f){ $app.innerHTML = frame('<div class="empty">This did not open. Try again soon.</div>'); return; }
  if(v.kind==='video' && f.video_url){
    const e = embedUrl(f.video_url);
    $app.innerHTML = frame(e ? `<div class="vidwrap" style="margin-top:12px"><iframe src="${esc(e)}" title="${esc(v.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`
                             : `<div class="row"><a class="btn" href="${esc(f.video_url)}" target="_blank" rel="noopener">Watch</a></div>`); return;
  }
  const url = await fileUrl(f);
  if(!url){ $app.innerHTML = frame('<div class="empty">This did not open. Try again soon.</div>'); return; }
  if(v.kind==='pdf'){
    $app.innerHTML = frame(`<div class="zoom"><button class="btn white small" id="zOut">Smaller</button><button class="btn white small" id="zIn">Bigger</button><a class="btn small" href="${esc(url)}" target="_blank" rel="noopener">Open PDF</a></div><div class="pdfbox" id="pdfbox"></div>`);
    bindPdf(url); return;
  }
  if(v.kind==='audio'){ $app.innerHTML = frame(`<div class="card"><audio class="media audio" controls preload="metadata" src="${esc(url)}"></audio></div>`); return; }
  $app.innerHTML = frame(`<video class="media" controls playsinline preload="metadata" src="${esc(url)}" style="margin-top:12px"></video>`);
}
function bindPdf(url){
  const box=document.getElementById('pdfbox');
  document.getElementById('zIn').onclick=()=>{ pdfZoom=Math.min(2.5,pdfZoom+0.25); renderPdf(url, box); };
  document.getElementById('zOut').onclick=()=>{ pdfZoom=Math.max(0.75,pdfZoom-0.25); renderPdf(url, box); };
  renderPdf(url, box);
}

function adminTabs(which){ return `<div class="tabs" role="tablist" style="margin-bottom:16px"><button class="${which==='shelf'?'on':''}" onclick="location.hash='#/admin'">Shelf</button><button class="${which==='members'?'on':''}" onclick="location.hash='#/admin/members'">Members</button></div>`; }
let openFiles = null;
async function viewAdmin(){

  if(!admin()){ location.hash='#/shelf'; return; }
  $app.innerHTML = header()+'<div class="empty">Opening…</div>';
  await loadVolumes();
  let vers = {};
  if(!S.preview){ const { data } = await S.sb.from('shelf_versions').select('volume_id,tier,bucket,file_path'); (data||[]).forEach(r=>{ (vers[r.volume_id] ||= {})[r.tier]=r; }); }

    <div id="nUrlWrap" class="hidden"><label for="nUrl">Video link</label><input id="nUrl" type="url" placeholder="https://youtu.be/…"><p class="note" style="margin-top:6px">Tip: set the YouTube video to Unlisted. Then it only plays here.</p></div>
    <div class="row"><button class="btn" id="nGo">Put It on the Shelf</button></div>
  </div>
  <span class="section-title">On the Shelf now</span>
  <div class="card">${items.length ? items.map(v=>`<div class="adm-item" style="flex-wrap:wrap"><div><b>${esc(v.title)}</b>
     <span class="meta">${esc(KIND_LABEL[v.kind||'booklet']||'')} · ${TIER_LABEL[v.tier||'free']}${v.status==='hidden'?' · <strong>HIDDEN</strong>':''}</span></div>
     <div class="btns">${v.kind==='pdf'?`<button class="btn white small" data-files="${esc(v.id)}">Files</button>`:''}
       <button class="btn white small" data-toggle="${esc(v.id)}">${v.status==='hidden'?'Show':'Hide'}</button>
       ${isFileItem(v)?`<button class="btn danger small" data-del="${esc(v.id)}">Delete</button>`:''}</div>
     ${v.kind==='pdf'&&openFiles===v.id?`<div class="versions" style="flex-basis:100%"><p style="margin-bottom:6px"><strong>Extra copies.</strong> Give one book a free peek, a members copy, and a full copy. Each person sees the best copy they can open.</p>
       ${['free','member','vip'].map(t=>{ const r=vers[v.id]?.[t]; return `<div class="ver"><b style="font-size:15px">${LEVEL_PILL[t]}</b>
         <span class="meta" style="display:block">${r?'Has a file ✓':'No file yet'}</span>
         <div class="row" style="margin-top:6px"><input type="file" accept="application/pdf" id="vf-${t}" aria-label="${LEVEL_PILL[t]} file" style="flex:1;min-width:180px">
         <button class="btn small" data-vup="${t}">Upload</button>${r?`<button class="btn danger small" data-vrm="${t}">Remove</button>`:''}</div></div>`; }).join('')}</div>`:''}</div>`).join('') : '<div class="empty">Nothing yet.</div>'}</div>`;

  const kindSel=document.getElementById('nKind');

    document.getElementById('nFile').accept = k==='pdf'?'application/pdf':k==='audio'?'audio/*':'video/*'; };
  document.getElementById('nGo').onclick=async()=>{
    const btn=document.getElementById('nGo');
    const title=document.getElementById('nTitle').value.trim(), desc=document.getElementById('nDesc').value.trim();
    const k=kindSel.value, tier=document.getElementById('nTier').value, kind = k==='video-link'?'video':k;
    if(!title) return toast('Please add a title.');
    if(S.preview) return toast('Preview mode: this works on the live app.');
    let bucket=null, file_path=null, video_url=null;
    if(k==='video-link'){ video_url=document.getElementById('nUrl').value.trim(); if(!/^https?:\/\//i.test(video_url)) return toast('Paste the whole video link. It starts with https://'); }
    else {
      const file=document.getElementById('nFile').files[0];
      if(!file) return toast('Please pick a file.');
      if(file.size > 50*1024*1024) return toast('That file is too big. It must be under 50 MB.');
      bucket = tier==='free' ? 'shelf-public' : 'shelf-sealed';
      const ext = (file.name.match(/\.[a-z0-9]+$/i)||[''])[0].toLowerCase();
      file_path = `${Date.now()}-${slug(file.name.replace(/\.[^.]+$/,''))}${ext}`;
      btn.disabled=true; btn.textContent='Uploading…';
      const { error } = await S.sb.storage.from(bucket).upload(file_path, file, { contentType:file.type||undefined, upsert:false });
      if(error){ btn.disabled=false; btn.textContent='Put It on the Shelf'; return toast('Upload did not work: '+error.message); }
    }
    btn.disabled=true; btn.textContent='Saving…';
    const id = slug(title)+'-'+Date.now().toString(36).slice(-4);
    const sort = Math.max(0, ...items.map(i=>i.sort||0)) + 1;
    const r1 = await S.sb.from('volumes').insert({ id, numeral:'', title, subtitle:desc, status:'live', sort, kind, tier });
    const r2 = r1.error ? r1 : await S.sb.from('shelf_files').insert({ volume_id:id, bucket, file_path, video_url });
    if(r1.error || r2.error){
      if(file_path) await S.sb.storage.from(bucket).remove([file_path]);
      if(!r1.error) await S.sb.from('volumes').delete().eq('id',id);
      btn.disabled=false; btn.textContent='Put It on the Shelf';
      return toast('It did not save: '+(r1.error||r2.error).message);
    }
    toast('Done! It is on the Shelf.'); viewAdmin();

    const t=b.dataset.vup, file=document.getElementById('vf-'+t).files[0];
    if(!file) return toast('Please pick a PDF first.');
    if(S.preview) return toast('Preview mode: this works on the live app.');
    if(file.size > 50*1024*1024) return toast('That file is too big. It must be under 50 MB.');
    const bucket = t==='free' ? 'shelf-public' : 'shelf-sealed';
    const path = `${Date.now()}-${slug(openFiles)}-${t}.pdf`;
    b.disabled=true; b.textContent='Uploading…';
    const up = await S.sb.storage.from(bucket).upload(path, file, { contentType:'application/pdf', upsert:false });
    if(up.error){ b.disabled=false; b.textContent='Upload'; return toast('Upload did not work: '+up.error.message); }

    if(old && old.bucket!=='site') await S.sb.storage.from(old.bucket).remove([old.file_path]);
    toast('Done! That copy is saved.'); viewAdmin();
  });
  $app.querySelectorAll('[data-vrm]').forEach(b=>b.onclick=async()=>{
    const t=b.dataset.vrm, old=vers[openFiles]?.[t];
    if(!confirm(`Remove the ${LEVEL_PILL[t]} copy?`)) return;
    if(S.preview) return toast('Preview mode: this works on the live app.');
    const { error } = await S.sb.from('shelf_versions').delete().eq('volume_id',openFiles).eq('tier',t);
    if(error) return toast(error.message);
    if(old && old.bucket!=='site') await S.sb.storage.from(old.bucket).remove([old.file_path]);
    toast('Removed.'); viewAdmin();

  $app.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{

    if(error) return toast(error.message); toast(v.status==='hidden'?'It is on the Shelf again.':'It is hidden now.'); viewAdmin();
  });
  $app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(S.preview) return toast('Preview mode: this works on the live app.');
    const v=items.find(x=>x.id===b.dataset.del);
    if(!confirm(`Delete "${v.title}"? This also deletes its files. You can't undo this.`)) return;
    const { data:f } = await S.sb.from('shelf_files').select('bucket,file_path').eq('volume_id',v.id).maybeSingle();
    if(f?.file_path && f?.bucket) await S.sb.storage.from(f.bucket).remove([f.file_path]);
    Object.values(vers[v.id]||{}).forEach(async r=>{ if(r.bucket!=='site') await S.sb.storage.from(r.bucket).remove([r.file_path]); });
    const { error } = await S.sb.from('volumes').delete().eq('id',v.id);
    if(error) return toast(error.message); toast('Deleted.'); viewAdmin();
  });
}

}
async function viewGuild(){
  renderNav('guild');

  $app.innerHTML=header()+'<div class="empty">Opening the VIP Lounge…</div>';
  await loadCats();
  const full = vip() || admin();
  const open = S.cats.filter(c=>full || c.tier==='member');
  const sealedCat = id => { const c=S.cats.find(x=>x.id===id); return c && c.tier!=='member' && !full; };
  if(guildCat && !S.cats.some(c=>c.id===guildCat)) guildCat=null;
  let threads=[], teasers=[];
  if(S.preview){ const all=PREVIEW.threads.filter(t=>!guildCat||t.category_id===guildCat); threads=all.filter(t=>!sealedCat(t.category_id)); teasers=all.filter(t=>sealedCat(t.category_id)); }
  else {
    if(!guildCat || !sealedCat(guildCat)){
      let q=S.sb.from('forum_threads').select('id,title,created_at,category_id,author:profiles(display_name),forum_posts(count)').order('created_at',{ascending:false}).limit(50);
      if(guildCat) q=q.eq('category_id',guildCat);
      const { data, error } = await q; if(error) toast('Posts did not load.'); threads=data||[];
    }
    if(!full){ const { data } = await S.sb.rpc('guild_teasers'); teasers=(data||[]).filter(t=>!guildCat||t.category_id===guildCat); }
  }
  const catName = id => S.cats.find(c=>c.id===id)?.name || '';
  const replies = t => S.preview?(t.posts||[]).length:(t.forum_posts?.[0]?.count ?? t.replies ?? 0);
  $app.innerHTML=header()+top+`
  ${full?'':`<div class="card dash"><p>You can use the open rooms. Rooms with a lock are for VIPs.</p></div>`}
  <div class="chips"><button class="chip ${!guildCat?'on':''}" data-c="">All</button>${S.cats.map(c=>`<button class="chip ${guildCat===c.id?'on':''}" data-c="${c.id}">${sealedCat(c.id)?'🔒 ':''}${esc(c.name)}</button>`).join('')}</div>
  ${open.length?`<div class="row" style="margin:4px 0 14px"><button class="btn" id="newT">+ New Post</button></div>
  <div id="newForm" class="card hidden"><h2>New post</h2>
    <label for="tCat">Room</label><select id="tCat">${open.map(c=>`<option value="${c.id}" ${guildCat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
    <label for="tTitle">Title</label><input id="tTitle" maxlength="140">
    <label for="tBody">Message</label><textarea id="tBody" maxlength="5000"></textarea>
    <div class="row"><button class="btn" id="tPost">Post</button><button class="btn white" id="tCancel">Cancel</button></div></div>`:''}
  ${threads.map(t=>{const n=replies(t);return `<button class="thread" data-t="${t.id}"><h3>${esc(t.title)}</h3>
   <div class="meta">${esc(t.author?.display_name||'Member')} · ${esc(catName(t.category_id))} · ${when(t.created_at)} · ${n} ${n===1?'reply':'replies'}</div></button>`}).join('')}
  ${teasers.map(t=>{const n=replies(t);return `<button class="thread sealed" data-lock="1"><h3>🔒 ${esc(t.title)}</h3>
   <div class="meta">${esc(catName(t.category_id))} · ${when(t.created_at)} · ${n} ${n===1?'reply':'replies'} · VIPs only</div></button>`}).join('')}
  ${!threads.length&&!teasers.length?'<div class="empty">No posts yet. Be the first!</div>':''}
  ${full?'':vipGate('Want every room?','VIPs can read and post in every room.')}`;
  $app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{guildCat=b.dataset.c?+b.dataset.c:null;viewGuild();});
  $app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>location.hash='#/guild/'+b.dataset.t);
  $app.querySelectorAll('[data-lock]').forEach(b=>b.onclick=()=>{ toast('That room is for VIPs.'); location.hash='#/account'; });
  const f=document.getElementById('newForm'); if(!f) return;
  document.getElementById('newT').onclick=()=>f.classList.remove('hidden');
  document.getElementById('tCancel').onclick=()=>f.classList.add('hidden');
  document.getElementById('tPost').onclick=async()=>{
    const title=document.getElementById('tTitle').value.trim(), body=document.getElementById('tBody').value.trim(), cat=+document.getElementById('tCat').value;
    if(!title||!body) return toast('Please add a title and a message.');
    if(S.preview) return toast('Preview mode: posting works on the live app.');
    const { error } = await S.sb.from('forum_threads').insert({title,body,category_id:cat,author_id:S.user.id});
    if(error) return toast('That did not post: '+error.message);
    toast('Posted!'); viewGuild();
  };
}
async function viewThread(id){
  renderNav('guild');
  if(!signedIn()) return viewGuild();
  let t, posts;
  if(S.preview){ t=PREVIEW.threads.find(x=>x.id===+id); posts=t?.posts||[]; if(t && !vip() && PREVIEW.categories.find(c=>c.id===t.category_id)?.tier!=='member') t=null; }
  else {
    t=(await S.sb.from('forum_threads').select('id,title,body,created_at,author:profiles(display_name)').eq('id',id).maybeSingle()).data;
    posts=(await S.sb.from('forum_posts').select('id,body,created_at,author:profiles(display_name)').eq('thread_id',id).order('created_at')).data||[];
  }
  if(!t){ $app.innerHTML=header()+'<div class="empty">We could not find that post.</div>'; return; }
  $app.innerHTML=header()+`<div class="reader-head"><button class="back" onclick="location.hash='#/guild'">‹ VIP Lounge</button></div>
  <div class="card"><h2>${esc(t.title)}</h2><div class="meta">${esc(t.author?.display_name||'Member')} · ${when(t.created_at)}</div>
   <div class="post"><div class="txt">${esc(t.body)}</div></div>
   ${posts.map(p=>`<div class="post"><div class="who">${esc(p.author?.display_name||'Member')} <span class="meta">· ${when(p.created_at)}</span></div><div class="txt">${esc(p.body)}</div></div>`).join('')||'<div class="empty">No replies yet.</div>'}</div>
  <div class="card"><label for="rBody">Your reply</label><textarea id="rBody" maxlength="5000"></textarea><div class="row"><button class="btn" id="rPost">Reply</button></div></div>`;
  document.getElementById('rPost').onclick=async()=>{
    const body=document.getElementById('rBody').value.trim(); if(!body) return;
    if(S.preview) return toast('Preview mode: replies work on the live app.');
    const { error } = await S.sb.from('forum_posts').insert({thread_id:+id,body,author_id:S.user.id});
    if(error) return toast('That did not post: '+error.message); viewThread(id);
  };
}

async function doAuth(){
  const email=document.getElementById('aEmail').value.trim(), pass=document.getElementById('aPass').value;
  if(!email||pass.length<8) return toast('Type your email and a password with 8 or more letters or numbers.');
  if(S.preview){ S.demoUser=true; toast('Preview: you are signed in.'); return viewAccount(); }
  if(authTab==='up'){
    const name=(document.getElementById('aName').value.trim()||email.split('@')[0]).slice(0,40);
    const { data, error } = await S.sb.auth.signUp({email,password:pass,options:{data:{display_name:name, marketing_opt_in: !!document.getElementById('aOpt')?.checked},emailRedirectTo:location.origin}});
    if(error) return toast(error.message);
    if(!data.session) return toast('Almost done! Check your email and tap the link.');
  } else {
    const { error } = await S.sb.auth.signInWithPassword({email,password:pass});
    if(error) return toast(error.message);
  }
}
async function redeem(){
  const code=document.getElementById('code').value.trim().toUpperCase(); if(!code) return;
  if(S.preview){ S.demoVip=true; toast('Preview: you are a VIP.'); return viewAccount(); }
  const { data, error } = await S.sb.rpc('redeem_vip_code',{p_code:code});
  if(error) return toast(error.message);
  if(!data) return toast('That key does not work, or it was already used.');
  await loadProfile(); S.pages={}; toast('Welcome, VIP!'); viewAccount();
}

      <li><strong>Your account:</strong> your email, your name, and your password. Our database company, Supabase, keeps them safe. We can't see your password.</li>
      <li><strong>VIP info:</strong> if you are a VIP, when it ends, and how you paid.</li>
      <li><strong>VIP Lounge:</strong> what you post. Members can see your name and posts in rooms they can open.</li>
      <li><strong>Payments:</strong> PayPal and Blockonomics take your payments. They get what they need to do that. We get a note that you paid. We never see your card number.</li>
      <li><strong>Emails:</strong> if you check the box for emails, we may add your name and email to our mail list. Each email has a link to stop. You can also turn it off on the Account page.</li></ul>
    <h2>Your journal</h2><p>Your journal stays on your own phone. It never comes to us. We can't read it. If you clear your browser or get a new phone, your journal will be gone.</p>
    <h2>What we don't do</h2><p>No ads. No tracking. We never sell or rent your info. The app saves a few small settings on your phone, like big text.</p>
    <h2>Other companies</h2><p>The app uses fonts from Google. Payments use PayPal and Blockonomics. Videos may come from YouTube or Vimeo. These companies have their own rules about your info.</p>
    <h2>Your choices</h2><p>Want to see, fix, or delete your info? Email us at <a href="mailto:${esc(CONFIG.ADMIN_EMAIL)}">${esc(CONFIG.ADMIN_EMAIL)}</a>. The Vault is for grown-ups. We do not mean to keep info from anyone under 18.</p>`],
  accessibility: ['Accessibility', `
    <p>We want everyone to be able to use the MOB Vault. That includes people who use screen readers, keyboards, or zoom. We aim to meet a set of web rules called WCAG 2.1 AA. These rules help make websites easy for all people to use.</p>
    <h2>What is built in</h2><ul>
      <li>A <strong>Big text</strong> button on the Account page.</li>
      <li>Names on buttons, links, and boxes, so screen readers can read them.</li>
      <li>A "Skip to content" link.</li>
      <li>You can use the whole app with a keyboard.</li>
      <li>If your phone is set to less motion, the app stops moving things.</li>
      <li>Dark words on a light page, so they are easy to read.</li>
      <li>Each PDF book has an "Open PDF" button. Your phone can read the file out loud.</li></ul>
    <h2>Need help?</h2><p>Is something hard to use? Do you need a page in a different form? Email <a href="mailto:${esc(CONFIG.ADMIN_EMAIL)}">${esc(CONFIG.ADMIN_EMAIL)}</a>. We will write back in a few days and help.</p>`]
};
function viewLegal(k){
  renderNav('account');
  const p = LEGAL_PAGES[k]; if(!p){ location.hash='#/account'; return; }
  $app.innerHTML=header()+`<div class="reader-head"><button class="back" onclick="history.length>1?history.back():location.hash='#/account'">‹ Back</button></div>
  ${hero(esc(p[0]),'Last changed '+LEGAL_UPDATED)}<div class="card legal">${p[1]}</div>${footer()}`;
}

/* ============ ROUTER ============ */
async function route(){
  window.scrollTo(0,0);
  const parts=(location.hash||'#/shelf').slice(2).split('/');
  try{
    if(parts[0]==='read') return await viewReader(decodeURIComponent(parts[1]), +parts[2]||0);
    if(parts[0]==='item') return await viewItem(decodeURIComponent(parts[1]));
    if(parts[0]==='guild') return parts[1] ? await viewThread(parts[1]) : await viewGuild();
    if(parts[0]==='admin') return parts[1]==='members' ? await viewMembers() : await viewAdmin();
    if(parts[0]==='guide') return viewCryptoGuide();
    if(parts[0]==='legal') return viewLegal(parts[1]);
    if(parts[0]==='journal') return viewJournal();
    if(parts[0]==='account') return viewAccount();
    return await viewShelf();
  }catch(e){ console.error(e); $app.innerHTML=header()+'<div class="empty">Something went wrong. Please refresh.</div>'; }
}

/* ============ START ============ */
(async function init(){
  applyTheme();
  if(store('mobvault.bigtext')) document.documentElement.classList.add('big');
  // Copyright on every page, and PayPal buttons wherever a page has a spot for one
  new MutationObserver(()=>{
    if(!$app.querySelector('.foot')) $app.insertAdjacentHTML('beforeend', `<footer class="foot">${copyright()}</footer>`);
    mountPayPal();
  }).observe($app,{childList:true});
  S.preview = CONFIG.SUPABASE_URL.includes('YOUR-') || !window.supabase;
  if(!S.preview){
    S.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    const { data } = await S.sb.auth.getSession(); S.user = data.session?.user || null;
    await loadProfile();
    S.sb.auth.onAuthStateChange(async (_e, session)=>{
      const was=S.user?.id; S.user=session?.user||null;
      if(was!==S.user?.id){ await loadProfile(); S.pages={}; route(); }
    });
  }
  window.addEventListener('hashchange', route);
  route();
  if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
